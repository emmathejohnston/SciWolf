const animalInfo = {
  butterfly: "The monarch passes through here on its way to Mexico — a journey of thousands of kilometres, navigated by an animal weighing less than a paperclip. Its larvae eat only milkweed.",
  rabbit: "The eastern cottontail grazes close to cover and rarely ventures far into the open. Its constant nibbling keeps clearings diverse and creates the low vegetation many ground-nesting birds need.",
  fox: "The red fox is one of the most adaptable predators on the continent. It eats rabbits, voles, berries, and insects, and carries seeds in its scat wherever it travels.",
  deer: "White-tailed deer are powerful shapers of forest structure. Too many and they browse the understorey to nothing; the right number creates openings and diversity. Their relationship with this land is older than ours.",
  owl: "The barred owl hunts from dusk to dawn, taking voles, mice, frogs, and occasionally other birds. Its call — 'who cooks for you, who cooks for you-all' — carries far on still nights.",
};

function eatPlant(plant, sp, sx2, sy2) {
  player.ledger.took++; player.ledger.totalTook++;
  disturb(plant);
  const idx = plants.indexOf(plant);
  if (sp.edible) {
    if (sp.edible.poisonous) {
      player.hunger = Math.max(0, player.hunger + sp.edible.restore);
      showFloatText('Poisonous!', sx2, sy2-30, '#f87171');
      noteEat(sp, true, 0);
    } else {
      player.hunger = Math.min(1, player.hunger + sp.edible.restore);
      const pct = Math.round(sp.edible.restore*100);
      showFloatText(`+${pct}%`, sx2, sy2-30, '#4ade80');
      noteEat(sp, false, pct);
      // Seed credit — berries, nuts, seeds, keys, acorns pass through the gut.
      // Mature plants yield up to 3 seeds; young plants yield 1.
      if (sp.edible.part && /berries|nuts|seeds|keys|acorns/i.test(sp.edible.part)) {
        const maturity = sp.matureAge ? Math.min(1, plant.age / sp.matureAge) : 1;
        const yield_ = maturity >= 1 ? 3 : 1;
        const gained = Math.min(yield_, SEED_CAP - totalSeeds());
        if (gained > 0) {
          player.seeds[sp.id] = (player.seeds[sp.id] || 0) + gained;
          showFloatText(`+${gained} seed${gained > 1 ? 's' : ''}`, sx2, sy2-48, '#a7f3d0');
        }
      }
      if (idx !== -1) {
        plants.splice(idx, 1);
        if (sp.layer === 'fungal') setTimeout(() => addPlant(sp.id, plant.x), 3000);
      }
    }
  } else {
    // Non-edible — cut down or remove
    if (idx !== -1) plants.splice(idx, 1);
    showFloatText(sp.layer === 'canopy' ? 'Felled!' : 'Removed', sx2, sy2-30, '#94a3b8');
  }
}

function showFloatText(text, x, y, color) {
  const p = addParticle('float_text', 0, 0);
  p.x = x; p.y = y; p.text = text; p.color = color;
  p.vx = 0; p.vy = -40; p.life = 1.5;
}

// ── LISTEN ────────────────────────────────────────────────────────────────────
// Pause-like attentive state: 5 seconds of slowed time, a vignette,
// and a single line of per-species text fading in over the plant.
const LISTEN_DURATION = 5.0;
let listenT = 0;         // seconds remaining
let listenPlant = null;  // which plant we're listening to
let listenText = '';     // the chosen line

function startListening(sp, plantObj) {
  if (!sp || !plantObj) return;
  if (!sp.listen || sp.listen.length === 0) return;
  listenT = LISTEN_DURATION;
  listenPlant = plantObj;
  listenText = sp.listen[Math.floor(Math.random() * sp.listen.length)];
  player.ledger.listened++; player.ledger.totalListened++;
  noteListen(sp, listenText);
  hideInfoCard();
}

function cancelListening() {
  listenT = 0;
  listenPlant = null;
  listenText = '';
}

function wrapText(text, maxWidth) {
  const words = text.split(' ');
  const out = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxWidth && cur) {
      out.push(cur); cur = w;
    } else {
      cur = t;
    }
  }
  if (cur) out.push(cur);
  return out;
}

function drawListening() {
  if (listenT <= 0 || !listenPlant) return;
  const elapsed = LISTEN_DURATION - listenT;
  const fadeIn = Math.min(1, elapsed / 0.5);
  const fadeOut = Math.min(1, listenT / 0.5);
  const alpha = Math.min(fadeIn, fadeOut);

  // Vignette
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const innerR = Math.min(canvas.width, canvas.height) * 0.18;
  const outerR = Math.hypot(canvas.width, canvas.height) * 0.6;
  const g = ctx.createRadialGradient(cx, cy, innerR, cx, cy, outerR);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, `rgba(0,0,0,${0.55 * alpha})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Letter-by-letter reveal of the line, anchored above the plant.
  const charsPerSec = 28;
  const revealChars = Math.min(listenText.length, Math.floor(elapsed * charsPerSec));
  const shown = listenText.substring(0, revealChars);

  const sx = listenPlant.x - camX;
  const sp = SPECIES[listenPlant.speciesId];
  const maturity = sp ? Math.min(1, listenPlant.age / sp.matureAge) : 1;
  const plantTop = groundY(listenPlant.x) - (sp ? sp.heightPx : 40) * maturity;
  const anchorY = Math.max(80, plantTop - 28);

  ctx.font = '600 18px Georgia, "Times New Roman", serif';
  ctx.fillStyle = `rgba(241,245,249,${alpha})`;
  ctx.textAlign = 'center';
  const lines = wrapText(shown, 360);
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], sx, anchorY + i * 24 - (lines.length - 1) * 12);
  }
  ctx.textAlign = 'left';
}

// Sow a seed at world-x. sx,sy are screen-space for feedback particles.
// Returns true if a plant was placed (seed consumed).
function sow(sp, wx, sx, sy) {
  if (!sp) return false;
  if ((player.seeds[sp.id] || 0) <= 0) return false;
  // Check if this chunk's layer cap is already full.
  const ci = chunkIdx(wx);
  const layer = sp.layer || 'ground';
  const cap = CHUNK_CAPS[layer] ?? 10;
  const occupied = (layer === 'fungal' ? fungi : plants).filter(p => p.chunkIdx === ci && SPECIES[p.speciesId]?.layer === layer).length;
  if (occupied >= cap) {
    player.seeds[sp.id]--;
    if (player.seeds[sp.id] <= 0) {
      delete player.seeds[sp.id];
      if (player.selectedSeed === sp.id) player.selectedSeed = null;
    }
    showFloatText('too crowded here', sx, sy-18, '#cbd5e1');
    return false;
  }
  const p = addPlant(sp.id, wx);
  if (!p) return false;
  p.chunkIdx = ci;
  player.ledger.gave++; player.ledger.totalGave++;
  player.seeds[sp.id]--;
  if (player.seeds[sp.id] <= 0) {
    delete player.seeds[sp.id];
    if (player.selectedSeed === sp.id) player.selectedSeed = null;
  }
  for (let i = 0; i < 2; i++) {
    const sp2 = addParticle('sow_spark', 0, 0);
    sp2.x = sx + (Math.random()-0.5)*6;
    sp2.y = sy + (Math.random()-0.5)*4;
  }
  return true;
}

// ── FIELD NOTES TRIGGERS ─────────────────────────────────────────────────────

// Called from the colonisation loop when a new plant is placed.
function noteNewSpecies(sp) {
  if (_clickedSpecies.has(sp.id)) return;
  _clickedSpecies.add(sp.id);
  const era = _coverToEraLabel();
  if (_notedSpeciesEras.has(era)) return;
  _notedSpeciesEras.add(era);
  const succPct = Math.round(averageSuccession() * 100);
  const persist = sp.persistence ? sp.persistence.strategy : null;
  const persistNote = persist ? ` Persistence: <em>${persist}</em>.` : '';
  const obs = `<strong>${sp.name}</strong> (${sp.latin}) has appeared. `
    + `Succession: ${succPct}%. Stage: ${sp.era}.${persistNote}`;
  const prompt = `Using the info card for ${sp.name}, explain why this species can establish here now.`;
  addFieldNote('New species', obs, prompt);
}

// Checks each frame whether succession era has changed.
function checkEraChange() {
  const label = _coverToEraLabel();
  if (_prevEraLabel === null) { _prevEraLabel = label; return; }
  if (label === _prevEraLabel) return;
  const prev = _prevEraLabel;
  _prevEraLabel = label;
  const succPct = Math.round(averageSuccession() * 100);
  const dominantIds = [..._seenSpecies].filter(id => {
    const s = SPECIES[id]; return s && s.era === label.split(' ')[0].toLowerCase();
  }).slice(0, 3).map(id => SPECIES[id].name).join(', ') || 'none yet observed';
  const obs = `The forest has moved from <em>${prev}</em> to <em>${label}</em>. `
    + `Succession: ${succPct}%. New species now present: ${dominantIds}.`;
  const prompt = `Name one species from the previous stage still visible, and one from the new stage. What changed in the forest to allow this?`;
  addFieldNote('Era change', obs, prompt);
}

// Called when the player eats or is poisoned by a plant.
function noteEat(sp, poisonous, restorePct) {
  const era = _coverToEraLabel();
  if (_notedEatEras.has(era)) return;
  _notedEatEras.add(era);
  const part = (sp.edible && sp.edible.part) ? sp.edible.part : 'part';
  let obs, prompt;
  if (poisonous) {
    obs = `You ate <strong>${sp.name}</strong> (${sp.latin}). It is toxic — hunger decreased.`;
    prompt = `Using the info card, why might ${sp.name} be toxic? What does it gain from this?`;
  } else {
    obs = `You ate the ${part} of <strong>${sp.name}</strong> (${sp.latin}), restoring ${restorePct}% hunger.`;
    prompt = `Using the info card, what other organisms depend on this plant's ${part}?`;
  }
  addFieldNote('Consumption', obs, prompt);
}

// Called when the player listens to a plant.
function noteListen(sp, listenLine) {
  const era = _coverToEraLabel();
  if (_notedListenEras.has(era)) return;
  _notedListenEras.add(era);
  const obs = `The ${sp.name} said: <em>"${listenLine}"</em>`;
  const prompt = `How do the words of the ${sp.name} connect to the information in its description?`;
  addFieldNote('Listen', obs, prompt);
}

// Called on player death.
function noteDeath() {
  const { took, gave, listened } = player.ledger;
  const lifeYears = Math.floor(year) - Math.floor(player.ledger.lifeStart);
  const obs = `You died in year ${Math.floor(year)} after ${lifeYears} years. `
    + `This life: ${took} harvest${took !== 1 ? 's' : ''}, ${gave} plant${gave !== 1 ? 's' : ''} sown, `
    + `${listened} listen${listened !== 1 ? 's' : ''}. Your body will decompose where it fell.`;
  const prompt = `Name two nutrients a decomposing body returns to the soil. How would nearby plants use them?`;
  addFieldNote('Death', obs, prompt);
}

// Called when mycelial view is first toggled on.
let _mycelialNoteGiven = false;
function noteMycelialView() {
  if (_mycelialNoteGiven) return;
  _mycelialNoteGiven = true;
  const fungiPresent = [..._seenSpecies]
    .filter(id => SPECIES[id] && SPECIES[id].layer === 'fungal')
    .map(id => SPECIES[id].name).join(', ') || 'none yet';
  const obs = `Underground fungal network visible. Fungal species present: ${fungiPresent}.`;
  const prompt = `Using the info card for one of the fungi above, what does each partner give and receive? What kind of relationship is this?`;
  addFieldNote('Mycelial view', obs, prompt);
}

// Called once when climax is sustained.
let _climaxNoteGiven = false;
function noteClimax() {
  if (_climaxNoteGiven) return;
  _climaxNoteGiven = true;
  const speciesCount = new Set(plants.map(p => p.speciesId)).size;
  const obs = `The forest has reached a climax state (succession ≥ 88%, sustained). `
    + `Total species present: ${speciesCount}. Year: ${Math.floor(year)}.`;
  const prompt = `Using species you can see, name a producer, a primary consumer, and a secondary consumer. Is a climax forest finished changing?`;
  addFieldNote('Climax forest', obs, prompt);
}

// ── PLAYER DEATH & REBIRTH ────────────────────────────────────────────────────
function killPlayer() {
  if (player.dead) return;
  noteDeath();
  player.dead = true;
  player.deathX = player.x;
  player.deathY = groundY(player.x);
  player.deathMsgT = 4.0;
  player.decomposed = 0;
  graves.push({
    x: player.x, y: player.deathY, sinkT: 0, nutrientT: 0,
    year: Math.floor(year),
    ledger: { took: player.ledger.took, gave: player.ledger.gave, listened: player.ledger.listened },
    memorial: 'trillium',
  });
  player.ledger.died++;
  cancelListening();
  // C6 — sink seamlessly into the mycelial view. Decomposition *is* the
  // underground perspective; the existing easing handles the crossfade.
  mycelialView = true;
}

function rebornPlayer() {
  player.dead = false;
  player.hunger = 1.0;
  player.x = 400;
  player.y = 0;
  player.dyingT = 0;
  player.decomposed = 0;
  // Reset per-life ledger counters (died persists across lives).
  player.ledger.took = 0;
  player.ledger.gave = 0;
  player.ledger.listened = 0;
  player.ledger.lifeStart = year;
  // Surface back into the walking world. Reset mycelial view immediately.
  mycelialView = false;
  mycelialT = 0;
  // E3 — spawn the chosen memorial species (default trillium) at grave.
  const lastGrave = graves[graves.length-1];
  if (lastGrave) {
    addPlant(lastGrave.memorial || 'trillium', lastGrave.x);
    lastGrave.sinkT = 2; // already sunk
  }
}

// ── MAIN LOOP ─────────────────────────────────────────────────────────────────
let lastTime = 0;

function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min((ts - lastTime)/1000, 0.05);
  lastTime = ts;

  // Listening tick — slows time to 0.25× for its duration.
  if (listenT > 0) {
    listenT = Math.max(0, listenT - dt);
    if (listenT === 0) cancelListening();
  }
  const effSpeed = (listenT > 0) ? 0.25 : speed;

  // Update time
  if (!paused && !player.dead) {
    year += dt * effSpeed;
  } else if (player.dead) {
    year += dt * effSpeed * 0.5; // time keeps passing during death
  }

  // Player movement (suppressed when notebook is open — let student type freely)
  if (!player.dead && !_notebookOpen) {
    const moveSpeed = 180;
    if (keys['ArrowLeft']||keys['a']||keys['A']) player.x -= moveSpeed*dt;
    if (keys['ArrowRight']||keys['d']||keys['D']) player.x += moveSpeed*dt;
    // Wrap around the world — fixed-width screen, player loops left↔right.
    player.x = ((player.x % WORLD_W) + WORLD_W) % WORLD_W;
    player.y = groundY(player.x);

    // Hunger — follows effective speed so listening doesn't starve you faster than it feels.
    player.hunger -= 0.04 * dt * effSpeed;
    if (player.hunger <= 0) { player.hunger=0; killPlayer(); }
  } else {
    // Death sequence
    const lastGrave = graves[graves.length-1];
    if (lastGrave) {
      lastGrave.sinkT = Math.min(lastGrave.sinkT + dt*0.2, 1);
      player.decomposed = lastGrave.sinkT;
    }
    player.deathMsgT = Math.max(0, player.deathMsgT - dt);
  }
  camX = 0; // fixed camera — world coordinates == screen coordinates

  // E1 — age grave nutrient plumes (in game-years).
  const yearDeltaGrave = dt * effSpeed;
  for (const g of graves) {
    if (g.nutrientT < 20) g.nutrientT += yearDeltaGrave;
  }

  // G2 — age plant graves; remove fully decomposed ones (after 100 in-game years).
  for (let i = plantGraves.length - 1; i >= 0; i--) {
    plantGraves[i].nutrientT += yearDeltaGrave;
    if (plantGraves[i].nutrientT >= 100) plantGraves.splice(i, 1);
  }

  // Update plants (includes light grid, soil grid, aging, spread, colonization)
  updatePlants(dt);

  // Biodiversity auto-sample every in-game year.
  if (Math.floor(year) > Math.floor(year - dt * effSpeed)) {
    sampleBiodiversity();
    if (_graphOpen) drawGraph();
  }

  // D2 — reflection line check (runs every frame, cheap; timer gates emission).
  checkReflection(dt);
  if (_reflectT > 0) _reflectT = Math.max(0, _reflectT - dt);
  // Field notes — pulse decay and succession era change detection.
  if (_notebookPulse > 0) _notebookPulse = Math.max(0, _notebookPulse - dt / 3);
  checkEraChange();
  // D3 — one-time end-of-age reflection modal.
  checkEndReflection(dt);

  // Update animals
  updateAnimals(dt);

  // Update particles
  updateParticles(dt);
  spawnAtmosphericParticles(dt);

  // Mycelial-view easing — full crossfade in ~0.8 s, in or out.
  const mTarget = mycelialView ? 1 : 0;
  const mRate   = dt / 0.8;
  if (mycelialT < mTarget)      mycelialT = Math.min(mTarget, mycelialT + mRate);
  else if (mycelialT > mTarget) mycelialT = Math.max(mTarget, mycelialT - mRate);
  updateMycParticles(dt);

  // C5 — on each false→true transition, fade in the next contextual line.
  // Suppress when triggered by death (C6) — the death message owns the screen.
  if (mycelialView && !_prevMycelialView && !player.dead) {
    mycelialLineText = myceliumLines[_mycelialLineIdx % myceliumLines.length];
    _mycelialLineIdx++;
    mycelialLineT = MYCELIAL_LINE_DURATION;
  }
  _prevMycelialView = mycelialView;
  if (mycelialLineT > 0) mycelialLineT = Math.max(0, mycelialLineT - dt);

  // C4 — trail sampling. Age existing samples and append a new one
  // every ~50 ms while the view is engaged and the player is alive.
  for (const tp of playerTrail) tp.age += dt;
  while (playerTrail.length > 0 && playerTrail[0].age > TRAIL_LIFE) playerTrail.shift();
  _trailSampleTimer -= dt;
  if (mycelialT > 0.05 && !player.dead && _trailSampleTimer <= 0) {
    playerTrail.push({ x: player.x, y: groundY(player.x) - 14, age: 0 });
    _trailSampleTimer = 0.05;
  }
  if (mycelialT <= 0.01) playerTrail.length = 0;

  // Recompute the network periodically while it's actually visible.
  _myceliumRecomputeTimer -= dt;
  if (mycelialT > 0.01 && _myceliumRecomputeTimer <= 0) {
    computeMycelium();
    _myceliumRecomputeTimer = 0.35;
  }

  // ── RENDER ──
  drawSky();
  drawMountains();
  drawHills();
  drawBgTrees();
  drawParticles('back');
  drawGround();
  drawGraveNutrient();

  // Mycelial tint: deep indigo over the sky, warm-black over the soil.
  // Applied after the ground so the soil reads as the dark medium the
  // glowing network threads through; applied before plants so above-ground
  // life sits faintly atop the underground view.
  if (mycelialT > 0) {
    const og = ctx.createLinearGradient(0, 0, 0, canvas.height);
    og.addColorStop(0, `rgba(26,16,48,${0.92 * mycelialT})`);
    og.addColorStop(1, `rgba(10,10,18,${0.95 * mycelialT})`);
    ctx.fillStyle = og;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  drawMycelium();
  drawMycParticles();

  // Above-ground life dims to ~30% during full mycelial view.
  const worldAlpha = 1 - 0.7 * mycelialT;
  ctx.globalAlpha = worldAlpha;

  // Draw plants sorted by layer (includes fungi from separate array)
  const layerOrder = { fungal:0, ground:1, shrub:2, canopy:3 };
  const allPlants = [...plants, ...fungi];
  const sortedPlants = allPlants.sort((a,b)=>layerOrder[SPECIES[a.speciesId].layer]-layerOrder[SPECIES[b.speciesId].layer]);

  const season = Math.floor((year%1)*4);
  const phase = ((year%1)*4)%1;

  // Background pass — every 3rd plant (any layer) held for foreground overlap
  for (const p of sortedPlants) {
    const sp = SPECIES[p.speciesId];
    if (p.id % 3 === 0) continue;
    const sx2 = p.x - camX;
    if (sx2 < -200 || sx2 > canvas.width+200) continue;
    const gY = groundY(p.x);
    const t = Math.min(p.age / sp.matureAge, 1);
    try { sp.draw(ctx, sx2, gY, t, season, phase, p.id); } catch(e2){}
  }

  // Animals — background (2/3)
  for (const a of animals) {
    if (a.id % 3 === 0) continue;
    const sx2 = a.x - camX;
    if (sx2 < -100 || sx2 > canvas.width+100) continue;
    const gY = groundY(a.x);
    const hopY = a.hopY||0;
    const spec = ANIMAL_SPECS[a.type];
    if (spec && spec.draw) {
      try { spec.draw(ctx, a, sx2, gY - hopY); } catch(e3){}
    }
  }

  // Draw player and graves
  drawOldGraves();
  drawPlantGraves();
  if (!player.dead) drawPlayer();
  else drawDeadPlayer();

  // Foreground pass — every 3rd plant + every 3rd animal drawn on top of the player
  for (const p of sortedPlants) {
    if (p.id % 3 !== 0) continue;
    const sp = SPECIES[p.speciesId];
    const sx2 = p.x - camX;
    if (sx2 < -200 || sx2 > canvas.width+200) continue;
    const gY = groundY(p.x);
    const t = Math.min(p.age / sp.matureAge, 1);
    try { sp.draw(ctx, sx2, gY, t, season, phase, p.id); } catch(e2){}
  }
  for (const a of animals) {
    if (a.id % 3 !== 0) continue;
    const sx2 = a.x - camX;
    if (sx2 < -100 || sx2 > canvas.width+100) continue;
    const gY = groundY(a.x);
    const hopY = a.hopY||0;
    const spec = ANIMAL_SPECS[a.type];
    if (spec && spec.draw) {
      try { spec.draw(ctx, a, sx2, gY - hopY); } catch(e3){}
    }
  }

  ctx.globalAlpha = 1;
  drawPlayerMycelial();
  drawParticles('front');
  drawMycelialText();
  drawReflection();
  drawUI();
  drawDebug();
  drawListening();
}

function applyParams(params) {
  if (!params) return;
  if (params.species) {
    for (const [id, overrides] of Object.entries(params.species)) {
      if (SPECIES[id]) Object.assign(SPECIES[id], overrides);
    }
  }
}

window.runHeadless = function(targetYears, params) {
  // Reset simulation state
  plants.length = 0;
  fungi.length = 0;
  year = 0;
  _bioLog.length = 0;
  nextPlantId = 0;
  graves.length = 0;
  plantGraves.length = 0;
  _seenSpecies.clear();
  initChunks();

  if (params) applyParams(params);
  speed = 1;
  initPlants();

  const DT = 0.1;
  let prevFloor = Math.floor(year);

  while (year < targetYears) {
    year += DT;
    updatePlants(DT);
    // Age plant graves (mirrors the frame loop logic)
    for (let i = plantGraves.length - 1; i >= 0; i--) {
      plantGraves[i].nutrientT += DT;
      if (plantGraves[i].nutrientT >= 100) plantGraves.splice(i, 1);
    }
    const curFloor = Math.floor(year);
    if (curFloor > prevFloor) {
      sampleBiodiversity();
      prevFloor = curFloor;
    }
  }

  window.__simComplete = true;
  window.__result = JSON.stringify(_bioLog);
};

// ── INIT ──────────────────────────────────────────────────────────────────────
initChunks();
initPlants();
requestAnimationFrame(frame);
</script>
