// Fallback frequency for any species missing the property.
for (const sp of Object.values(SPECIES)) {
  if (sp.frequency === undefined) sp.frequency = 0.10;
}

// ── PLANT INSTANCES ───────────────────────────────────────────────────────────
let plants = [];      // non-fungal plants (capped at 800)
let fungi = [];       // fungal fruiting bodies (capped separately at 150)
let nextPlantId = 0;

function addPlant(speciesId, wx) {
  const sp = SPECIES[speciesId];
  if (!sp) return null;
  wx = ((wx % WORLD_W) + WORLD_W) % WORLD_W; // wrap to world bounds
  const p = {
    id: nextPlantId++,
    speciesId,
    x: wx,
    age: 0,
    chunkIdx: chunkIdx(wx),
  };
  if (sp.layer === 'fungal') {
    fungi.push(p);
  } else {
    plants.push(p);
  }
  return p;
}

function initPlants() {
  // Start with a handful of pioneers spread across all chunks
  const n = chunks.length;
  for (let i = 0; i < Math.min(8, n); i++) addPlant('lichen', (i + 0.5) * CHUNK_W);
  for (let i = 0; i < Math.min(5, n); i++) addPlant('moss',   (i * 1.7 + 0.3) * CHUNK_W % WORLD_W);
}

// ── CHUNK SYSTEM — replaces light/soil grid ───────────────────────────────────
// Each 100px chunk tracks its own successional progress (0=pioneer, 1=climax)
// and a disturbance variable that suppresses succession after destructive acts.
const CHUNK_W = 100;
let chunks = [];

function initChunks() {
  const n = Math.max(1, Math.floor(WORLD_W / CHUNK_W));
  // Preserve existing chunk data when resizing; new chunks start at 0.
  const prev = chunks;
  chunks = Array.from({ length: n }, (_, i) =>
    prev[i] ? { ...prev[i] } : { succession: 0, disturbance: 0 }
  );
}

function chunkIdx(wx) {
  const x = ((wx % WORLD_W) + WORLD_W) % WORLD_W;
  return Math.min(chunks.length - 1, Math.floor(x / CHUNK_W));
}

// ── ERA GATE — trapezoidal spawn probability based on chunk succession ─────────
// floor: minimum gate value once a species has entered its window, preventing
// mid/late species from vanishing entirely at climax succession.
const ERA_WINDOWS = {
  pioneer: [0.00, 0.00, 0.20, 0.35, 0.00],
  early:   [0.05, 0.15, 0.38, 0.52, 0.00],
  mid:     [0.28, 0.42, 0.60, 0.74, 0.06],
  late:    [0.52, 0.65, 0.82, 0.93, 0.14],
  climax:  [0.72, 0.85, 1.00, 1.00, 0.00],
};

function eraGate(era, succession) {
  const w = ERA_WINDOWS[era];
  if (!w) return 0;
  const floor = w[4] ?? 0;
  if (succession < w[0]) return 0;
  if (succession > w[3]) return floor;
  if (succession < w[1]) return Math.max(floor, (succession - w[0]) / Math.max(0.001, w[1] - w[0]));
  if (succession > w[2]) return Math.max(floor, (w[3] - succession) / Math.max(0.001, w[3] - w[2]));
  return 1;
}

// Returns era name string from a succession value (used for UI and field notes).
function successionEraLabel(succession) {
  if (succession < 0.20) return 'Pioneer';
  if (succession < 0.45) return 'Early successional';
  if (succession < 0.68) return 'Mid successional';
  if (succession < 0.88) return 'Late successional';
  return 'Climax';
}

// Average succession across all chunks (used for field notes / era display).
function averageSuccession() {
  if (!chunks.length) return 0;
  return chunks.reduce((s, c) => s + c.succession, 0) / chunks.length;
}

function updateChunks(yearDelta) {
  for (const chunk of chunks) {
    // Succession advances at a rate suppressed by disturbance.
    const advanceRate = (1 / YEARS_TO_CLIMAX) * (1 - chunk.disturbance * 0.85);
    chunk.succession = Math.min(1, chunk.succession + advanceRate * yearDelta);
    // Disturbance decays linearly — 100 in-game years from 1.0 → 0.0.
    chunk.disturbance = Math.max(0, chunk.disturbance - (1 / 100) * yearDelta);
  }
}

// ── LAYER CAPS — per chunk ────────────────────────────────────────────────────
const CHUNK_CAPS = { canopy: 2, shrub: 7, ground: 10, fungal: 2 };

// Shade effect: if a canopy tree is present in a chunk, shrub/ground spawn
// probability is halved. Toggle in the debug panel.
let SHADE_EFFECT = true;

// Frequency scale — multiplied against all species frequencies at spawn time.
// Range 0.1–3.0; tunable via the debug slider.
let FREQ_SCALE = 0.2;
let _freqSliderDrag = false;
let _freqSliderBounds = null; // set each frame by drawDebug

// ── AGE & DEATH ───────────────────────────────────────────────────────────────
function agePlants(yearDelta) {
  for (const arr of [plants, fungi]) {
    for (let i = arr.length - 1; i >= 0; i--) {
      const p = arr[i];
      const sp = SPECIES[p.speciesId];
      if (!sp) { arr.splice(i, 1); continue; }
      p.age += yearDelta;
      const ratio = p.age / sp.maxAge;
      // Young plants: flat low death rate. Older plants: steep curve near max age.
      const pDeath = ratio < 0.2
        ? 0.005 * yearDelta
        : yearDelta * Math.pow(Math.max(0, (ratio - 0.3) / 0.7), 2);
      if (Math.random() < pDeath) {
        if (sp.layer !== 'fungal') {
          plantGraves.push({
            species: p.speciesId,
            x: p.x,
            y: groundY(p.x),
            diedAt: year,
            nutrientT: 0,
            successorSpecies: [],
          });
        }
        arr.splice(i, 1);
      }
    }
  }
}

// ── SPAWN PLANTS — era-gated, cap-limited, per-chunk seed rain ────────────────
function spawnPlants(yearDelta) {
  for (let ci = 0; ci < chunks.length; ci++) {
    const chunk = chunks[ci];
    // Count plants by layer for this chunk
    const count = { canopy: 0, shrub: 0, ground: 0, fungal: 0 };
    for (const p of plants)  { if (p.chunkIdx === ci) count[SPECIES[p.speciesId]?.layer]++; }
    for (const f of fungi)   { if (f.chunkIdx === ci) count.fungal++; }
    const hasCanopy = count.canopy > 0;

    for (const [id, sp] of Object.entries(SPECIES)) {
      const layer = sp.layer || 'ground';
      if (count[layer] >= (CHUNK_CAPS[layer] ?? 10)) continue;

      // Invasives only spawn after disturbance
      if (sp.invasive) {
        if (chunk.disturbance < 0.3) continue;
        if (Math.random() < sp.frequency * 3 * yearDelta) {
          _spawnAt(sp, ci);
          count[layer]++;
        }
        continue;
      }

      let prob = eraGate(sp.era, chunk.succession) * sp.frequency * FREQ_SCALE * yearDelta;
      if (prob <= 0) continue;
      if (SHADE_EFFECT && hasCanopy && layer !== 'canopy') prob *= 0.5;
      if (Math.random() < prob) {
        _spawnAt(sp, ci);
        count[layer]++;
      }
    }
  }
}

function _spawnAt(sp, ci) {
  const x = ci * CHUNK_W + Math.random() * CHUNK_W;
  const p = addPlant(sp.id, x);
  if (p) _seenSpecies.add(sp.id);
}

// ── DISTURBANCE — called when player harvests or removes a plant ──────────────
const DISTURBANCE_HIT = { canopy: 0.45, shrub: 0.15, ground: 0.05, fungal: 0.02 };

function disturb(plant) {
  const ci = plant.chunkIdx ?? chunkIdx(plant.x);
  if (!chunks[ci]) return;
  const sp = SPECIES[plant.speciesId];
  if (sp?.invasive) {
    // Removing an invasive reduces disturbance — it restores the chunk.
    chunks[ci].disturbance = Math.max(0, chunks[ci].disturbance - 0.10);
    return;
  }
  const hit = DISTURBANCE_HIT[sp?.layer] ?? 0.05;
  chunks[ci].disturbance = Math.min(1, chunks[ci].disturbance + hit);
  // Clearcutting a chunk (disturbance ≥ 0.9 after removing canopy) resets succession.
  if (sp?.layer === 'canopy' && chunks[ci].disturbance >= 0.9) {
    chunks[ci].succession = Math.max(0, chunks[ci].succession - 0.5);
  }
}

// ── UPDATE PLANTS — orchestrator ──────────────────────────────────────────────
function updatePlants(dt) {
  const yearDelta = dt * speed;
  if (yearDelta === 0) return;
  updateChunks(yearDelta);
  agePlants(yearDelta);
  spawnPlants(yearDelta);
}

// Backwards-compat stubs for field notes and graph that used cover/soil
function getCanopyCover() { return averageSuccession(); }
function averageSoil()    { return averageSuccession(); }

// ── MYCELIAL NETWORK ─────────────────────────────────────────────────────────
// Nodes are canopy trees + fungal plants. Edges are tree↔fungus (ecto),
// tree↔tree (root), and downward "shoot" stubs that trace each tree's
// implied root system into the soil. Recomputed on a short timer while the
// view is visible — cheap (n^2 across at most ~150 plants), and lets the
// network breathe as trees mature and saplings die.
const MYC_NEIGHBOURS  = 6;     // fan-out per node
const MYC_ECTO_RANGE  = 520;   // px — fungus reach to canopy
const MYC_ROOT_RANGE  = 480;   // px — canopy-to-canopy reach
function computeMycelium() {
  myceliumEdges = [];
  const canopies = [];
  for (const p of plants) {
    const sp = SPECIES[p.speciesId];
    if (!sp) continue;
    if (sp.layer === 'canopy') canopies.push(p);
  }
  // Each fungus reaches to its 6 nearest canopies within range.
  for (const f of fungi) {  // Now using the GLOBAL fungi array
    const near = [];
    for (const c of canopies) {
      const d = Math.abs(c.x - f.x);
      if (d <= MYC_ECTO_RANGE) near.push({ c, d });
    }
    near.sort((a, b) => a.d - b.d);
    for (let i = 0; i < Math.min(MYC_NEIGHBOURS, near.length); i++) {
      const c = near[i].c;
      const csp = SPECIES[c.speciesId];
      const maturity = Math.min(1, c.age / csp.matureAge);
      myceliumEdges.push({
        ax: f.x, ay: groundY(f.x) + 14,
        bx: c.x, by: groundY(c.x) + 26,
        // Closer/younger neighbours read a touch fainter so the brightest
        // strands are still the principal partnerships.
        strength: 0.30 + 0.55 * maturity * (1 - i * 0.08),
        type: 'ecto',
      });
    }
  }
  // Each canopy reaches to its 6 nearest other canopies within range.
  // Dedup by id-pair so each connection is drawn once.
  const seenPairs = new Set();
  for (let i = 0; i < canopies.length; i++) {
    const a = canopies[i];
    const near = [];
    for (let j = 0; j < canopies.length; j++) {
      if (i === j) continue;
      const d = Math.abs(canopies[j].x - a.x);
      if (d <= MYC_ROOT_RANGE) near.push({ c: canopies[j], d });
    }
    near.sort((x, y) => x.d - y.d);
    for (let k = 0; k < Math.min(MYC_NEIGHBOURS, near.length); k++) {
      const b = near[k].c;
      const key = a.id < b.id ? a.id + '-' + b.id : b.id + '-' + a.id;
      if (seenPairs.has(key)) continue;
      seenPairs.add(key);
      const asp = SPECIES[a.speciesId], bsp = SPECIES[b.speciesId];
      const ma = Math.min(1, a.age / asp.matureAge);
      const mb = Math.min(1, b.age / bsp.matureAge);
      myceliumEdges.push({
        ax: a.x, ay: groundY(a.x) + 26,
        bx: b.x, by: groundY(b.x) + 26,
        strength: 0.25 + 0.55 * Math.min(ma, mb) * (1 - k * 0.08),
        type: 'root',
      });
    }
  }
  // Downward root shoots — each mature canopy sends 4–6 stubs into the soil,
  // fanning out from the trunk. Seeded by plant id so they stay stable.
  for (const c of canopies) {
    const csp = SPECIES[c.speciesId];
    const maturity = Math.min(1, c.age / csp.matureAge);
    if (maturity < 0.2) continue;
    const baseY = groundY(c.x) + 6;
    const numShoots = 12 + Math.floor(prand(c.id, 1) * 9); // 12..20
    for (let s = 0; s < numShoots; s++) {
      // Spread the shoots across a 130° downward fan, jittered per shoot.
      const spread = (s / Math.max(1, numShoots - 1) - 0.5) * 2.3;
      const jitter = (prand(c.id, s + 10) - 0.5) * 0.45;
      const angle  = spread + jitter; // angle from straight-down
      const len = 84 + prand(c.id, s + 20) * 180 * (0.5 + maturity * 0.5);
      myceliumEdges.push({
        ax: c.x,
        ay: baseY,
        bx: c.x + Math.sin(angle) * len,
        by: baseY + Math.cos(angle) * len * 0.85 + 6,
        strength: 0.30 + 0.55 * maturity,
        type: 'shoot',
        seed: c.id * 17 + s,
      });
      // A few of the longest shoots get a forked sub-tip.
      if (prand(c.id, s + 30) < 0.10 && len > 10) {
        const forkSide = prand(c.id, s + 60) < 0.5 ? -1 : 1;
        const fAngle = angle + forkSide * (0.25 + prand(c.id, s + 40) * 0.65);
        const fLen   = len * (0.35 + prand(c.id, s + 50) * 0.35);
        const tipX = c.x + Math.sin(angle) * len;
        const tipY = baseY + Math.cos(angle) * len * 0.85 + 6;
        myceliumEdges.push({
          ax: tipX, ay: tipY,
          bx: tipX + Math.sin(fAngle) * fLen,
          by: tipY + Math.cos(fAngle) * fLen * 0.85,
          strength: 0.20 + 0.40 * maturity,
          type: 'shoot',
          seed: c.id * 17 + s + 100,
        });
      }
    }
  }
}

// ── ANIMALS ──────────────────────────────────────────────────────────────────
const ANIMAL_SPECS = {
  butterfly: { era:'early', eraStart:4,  layer:'air',    draw: drawButterfly },
  rabbit:    { era:'early', eraStart:4,  layer:'ground', draw: drawRabbit    },
  fox:       { era:'mid',   eraStart:15, layer:'ground', draw: drawFox       },
  deer:      { era:'mid',   eraStart:15, layer:'ground', draw: drawDeer      },
  owl:       { era:'late',  eraStart:35, layer:'canopy', draw: drawOwl       },
};

let animals = [];

function spawnAnimals() {
  for (const [type, spec] of Object.entries(ANIMAL_SPECS)) {
    if (year >= spec.eraStart && animals.filter(a=>a.type===type).length < 3) {
      if (Math.random() < 0.01) {
        animals.push({
          type, x: Math.random()*WORLD_W,
          y: 0, vx: (Math.random()-0.5)*60,
          state: 'walk', stateTimer: 2+Math.random()*3,
          flipX: false,
          wingPhase: 0
        });
      }
    }
  }
  // Remove animals that are too numerous
  while (animals.length > 20) animals.shift();
}

function updateAnimals(dt) {
  spawnAnimals();
  for (let i = animals.length-1; i>=0; i--) {
    const a = animals[i];
    const spec = ANIMAL_SPECS[a.type];
    if (!spec || year < spec.eraStart) { animals.splice(i,1); continue; }

    a.stateTimer -= dt;
    if (a.stateTimer <= 0) {
      if (a.state === 'walk' || a.state === 'fly') {
        a.state = 'pause';
        a.stateTimer = 1+Math.random()*2;
        a.vx = 0;
      } else {
        a.state = spec.layer==='air'?'fly':'walk';
        a.stateTimer = 2+Math.random()*4;
        a.vx = (Math.random()-0.5)*80*(a.type==='deer'?1.5:1);
        a.flipX = a.vx < 0;
      }
    }

    if (a.type === 'rabbit' && a.state === 'walk') {
      // hop pattern
      a.x += a.vx * dt;
      a.hopT = (a.hopT||0) + dt*8;
      a.hopY = Math.abs(Math.sin(a.hopT))*12;
    } else {
      a.x += a.vx * dt;
    }
    a.wingPhase = (a.wingPhase||0) + dt*8;

    // Wrap world
    if (a.x < 0) a.x = WORLD_W;
    if (a.x > WORLD_W) a.x = 0;

    // Season filter: butterfly only spring/summer
    const season = Math.floor((year%1)*4);
    if (a.type === 'butterfly' && (season===3)) { animals.splice(i,1); continue; }
    // owl only if trees exist
    if (a.type === 'owl' && year < 35) { animals.splice(i,1); continue; }
  }
}

function drawButterfly(ctx, a, sx, sy) {
  const wing = Math.sin(a.wingPhase)*0.7;
  ctx.save(); ctx.translate(sx, sy-30);
  // top wings
  for (let s=-1;s<=1;s+=2) {
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.bezierCurveTo(s*20,wing*20-15,s*30,5,s*5,8);
    ctx.fillStyle='#e87020'; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0,4);
    ctx.bezierCurveTo(s*18,wing*15+5,s*25,15,s*4,14);
    ctx.fillStyle='#c06010'; ctx.fill();
  }
  // body
  ctx.beginPath(); ctx.ellipse(0,5,2.5,8,0,0,Math.PI*2);
  ctx.fillStyle='#1a1a1a'; ctx.fill();
  ctx.restore();
}

function drawRabbit(ctx, a, sx, sy) {
  const hopY = a.hopY||0;
  ctx.save(); ctx.translate(sx, sy-hopY);
  if (a.flipX) ctx.scale(-1,1);
  // body
  ctx.beginPath(); ctx.ellipse(0,0,9,7,0,0,Math.PI*2);
  ctx.fillStyle='#c0a878'; ctx.fill();
  // head
  ctx.beginPath(); ctx.ellipse(-10,-5,6,5,0.4,0,Math.PI*2);
  ctx.fillStyle='#c0a878'; ctx.fill();
  // ears
  ctx.beginPath(); ctx.ellipse(-13,-14,2.5,7,-0.3,0,Math.PI*2);
  ctx.fillStyle='#c0a878'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(-9,-14,2.5,7,0.2,0,Math.PI*2);
  ctx.fillStyle='#c0a878'; ctx.fill();
  // tail
  drawCircle(ctx,9,0,4,'#e8e0d8');
  // eye
  drawCircle(ctx,-13,-6,1.5,'#1a1a1a');
  ctx.restore();
}

function drawFox(ctx, a, sx, sy) {
  ctx.save(); ctx.translate(sx, sy);
  if (a.flipX) ctx.scale(-1,1);
  // body
  ctx.beginPath(); ctx.ellipse(0,-10,14,8,-0.15,0,Math.PI*2);
  ctx.fillStyle='#c04010'; ctx.fill();
  // head
  ctx.beginPath(); ctx.ellipse(-18,-14,7,6,0.2,0,Math.PI*2);
  ctx.fillStyle='#c04010'; ctx.fill();
  // pointed snout
  ctx.beginPath(); ctx.moveTo(-24,-13); ctx.lineTo(-30,-11); ctx.lineTo(-24,-9);
  ctx.fillStyle='#c04010'; ctx.fill();
  // ears
  ctx.beginPath(); ctx.moveTo(-16,-19); ctx.lineTo(-20,-27); ctx.lineTo(-12,-22); ctx.closePath();
  ctx.fillStyle='#c04010'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-14,-21); ctx.lineTo(-17,-25); ctx.lineTo(-12,-22); ctx.closePath();
  ctx.fillStyle='#1a1a1a'; ctx.fill();
  // bushy tail
  ctx.beginPath(); ctx.moveTo(14,-10);
  ctx.quadraticCurveTo(28,-8,26,2);
  ctx.strokeStyle='#c04010'; ctx.lineWidth=8; ctx.stroke();
  drawCircle(ctx,26,2,6,'#f0f0e8');
  // legs
  for (let l=0;l<4;l++) {
    const lx=-8+l*6; const walk=Math.sin(a.wingPhase+l*Math.PI)*4;
    ctx.beginPath(); ctx.moveTo(lx,-3); ctx.lineTo(lx+walk,6);
    ctx.strokeStyle='#a03010'; ctx.lineWidth=3; ctx.stroke();
  }
  ctx.restore();
}

function drawDeer(ctx, a, sx, sy) {
  ctx.save(); ctx.translate(sx, sy);
  if (a.flipX) ctx.scale(-1,1);
  // legs
  for (let l=0;l<4;l++) {
    const lx=-12+l*8; const walk=a.state==='walk'?Math.sin(a.wingPhase*2+l*1.2)*6:0;
    ctx.beginPath(); ctx.moveTo(lx,-8); ctx.lineTo(lx+walk,-8+25);
    ctx.strokeStyle='#8a6040'; ctx.lineWidth=3.5; ctx.stroke();
  }
  // body
  ctx.beginPath(); ctx.ellipse(0,-18,20,10,-0.15,0,Math.PI*2);
  ctx.fillStyle='#a07050'; ctx.fill();
  // neck
  ctx.beginPath(); ctx.moveTo(-18,-22); ctx.quadraticCurveTo(-24,-30,-22,-38);
  ctx.strokeStyle='#a07050'; ctx.lineWidth=8; ctx.stroke();
  // head
  ctx.beginPath(); ctx.ellipse(-20,-40,7,5,0.5,0,Math.PI*2);
  ctx.fillStyle='#a07050'; ctx.fill();
  // snout
  ctx.beginPath(); ctx.ellipse(-26,-41,4,3,0.3,0,Math.PI*2);
  ctx.fillStyle='#8a5030'; ctx.fill();
  // antlers
  ctx.beginPath();
  ctx.moveTo(-18,-44); ctx.lineTo(-15,-55); ctx.lineTo(-10,-50);
  ctx.moveTo(-15,-55); ctx.lineTo(-20,-60);
  ctx.strokeStyle='#7a5030'; ctx.lineWidth=2; ctx.stroke();
  // eye
  drawCircle(ctx,-22,-41,2,'#1a1a1a');
  ctx.restore();
}

function drawOwl(ctx, a, sx, sy) {
  ctx.save(); ctx.translate(sx, sy-60);
  if (a.flipX) ctx.scale(-1,1);
  // body
  ctx.beginPath(); ctx.ellipse(0,0,10,14,0,0,Math.PI*2);
  ctx.fillStyle='#8a7050'; ctx.fill();
  // wing pattern
  for (let i=0;i<5;i++) {
    ctx.beginPath(); ctx.ellipse(5,(i-2)*4,8,2.5,0.3,0,Math.PI*2);
    ctx.fillStyle='#7a6040'; ctx.fill();
  }
  // head
  ctx.beginPath(); ctx.arc(0,-14,9,0,Math.PI*2);
  ctx.fillStyle='#8a7050'; ctx.fill();
  // ear tufts
  ctx.beginPath(); ctx.moveTo(-5,-22); ctx.lineTo(-8,-30); ctx.lineTo(-2,-24); ctx.closePath();
  ctx.fillStyle='#7a6040'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(5,-22); ctx.lineTo(8,-30); ctx.lineTo(2,-24); ctx.closePath();
  ctx.fillStyle='#7a6040'; ctx.fill();
  // face disc
  ctx.beginPath(); ctx.arc(0,-14,7,0,Math.PI*2);
  ctx.fillStyle='rgba(210,190,150,0.4)'; ctx.fill();
  // large eyes
  drawCircle(ctx,-3,-15,3,'#e8c050');
  drawCircle(ctx,3,-15,3,'#e8c050');
  drawCircle(ctx,-3,-15,1.5,'#1a1a1a');
  drawCircle(ctx,3,-15,1.5,'#1a1a1a');
  // beak
  ctx.beginPath(); ctx.moveTo(0,-13); ctx.lineTo(-2,-10); ctx.lineTo(2,-10); ctx.closePath();
  ctx.fillStyle='#c09040'; ctx.fill();
  ctx.restore();
}

// ── PLAYER ────────────────────────────────────────────────────────────────────
const player = {
  x: 400, y: 0, vx: 0,
  w: 14, h: 32,
  hunger: 1.0,
  dead: false,
  dyingT: 0,
  deadT: 0,
  deathX: 0, deathY: 0,
  decomposed: 0,
  graveFlower: null,
  reborn: false,
  camFreeze: 0,
  deathMsgT: 0,
  money: 0,
  moneyGlowT: 0,
  seeds: {},         // { speciesId: count } — gut-carried seeds
  selectedSeed: null, // speciesId currently selected for sowing, or null
  ledger: {
    took: 0,       // plants eaten or removed (per life)
    gave: 0,       // plants sown or tended (per life)
    listened: 0,   // Listen actions (per life)
    died: 0,       // deaths — persists across rebirths
    lifeStart: 0,  // year this life began
    // Session-wide totals (never reset) — used by D3 reflection.
    totalTook: 0,
    totalGave: 0,
    totalListened: 0,
  },
};

const SEED_CAP = 12; // total seeds carried across all species — a gut, not a warehouse
function totalSeeds() {
  let n = 0;
  for (const k in player.seeds) n += player.seeds[k];
  return n;
}

const graves = [];      // player-death graves — persists across lives
const plantGraves = []; // G2 — dead plant remains, persist up to 100 in-game years

function drawPlayer() {
  if (player.dead) {
    drawDeadPlayer();
    return;
  }
  const gY = groundY(player.x);
  const sx = player.x - camX;
  const t = player.dyingT; // 0 = upright, 1 = lying flat

  ctx.save();
  ctx.translate(sx, gY);
  ctx.rotate(t * Math.PI/2);

  ctx.fillStyle = '#596478';
  // head
  ctx.beginPath(); ctx.arc(0, -player.h + 7, 7, 0, Math.PI*2); ctx.fill();
  // body
  ctx.fillRect(-4, -player.h+14, 8, 12);
  // legs
  ctx.fillRect(-5, -player.h+26, 4, 10);
  ctx.fillRect(1, -player.h+26, 4, 10);
  // arms
  ctx.fillRect(-8, -player.h+16, 3, 8);
  ctx.fillRect(5, -player.h+16, 3, 8);

  ctx.restore();
}

// E2 — old graves drawn as mossed lumps. Called every frame (alive or dead)
// so graves remain visible when the player walks past them.
function drawOldGraves() {
  for (const g of graves) {
    if (g.sinkT < 2) continue; // only settled graves
    const dist = Math.abs(player.x - g.x);
    if (dist > 200) continue;
    const sx = g.x - camX;
    if (sx < -60 || sx > canvas.width + 60) continue;
    const gY = groundY(g.x);
    const alpha = Math.max(0, 1 - (dist - 120) / 80); // fade in from 200→120px
    ctx.save();
    ctx.globalAlpha = alpha * 0.7;
    // Mossed earth lump
    ctx.fillStyle = '#3a4a2e';
    ctx.beginPath();
    ctx.ellipse(sx, gY, 12, 4, 0, Math.PI, 0);
    ctx.fill();
    // Tiny moss tufts
    ctx.fillStyle = '#5a7a4a';
    ctx.fillRect(sx - 6, gY - 5, 2, 5);
    ctx.fillRect(sx + 2, gY - 7, 2, 7);
    ctx.fillRect(sx - 2, gY - 4, 2, 4);
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

// G2 — draw dead plant remains as small mossed lumps, fading out as they decompose.
function drawPlantGraves() {
  for (const g of plantGraves) {
    const dist = Math.abs(player.x - g.x);
    if (dist > 200) continue;
    const sx = g.x - camX;
    if (sx < -60 || sx > canvas.width + 60) continue;
    const gY = groundY(g.x);
    const opacity = 1 - (g.nutrientT / 100); // fades from 1 → 0 over 100 years
    const alpha = opacity * Math.max(0, 1 - (dist - 120) / 80);
    if (alpha <= 0) continue;
    ctx.save();
    ctx.globalAlpha = alpha * 0.65;
    // Small earth mound — slightly smaller than player graves
    ctx.fillStyle = '#4a3a2a';
    ctx.beginPath();
    ctx.ellipse(sx, gY, 8, 3, 0, Math.PI, 0);
    ctx.fill();
    // Moss tufts
    ctx.fillStyle = '#5a7a4a';
    ctx.fillRect(sx - 4, gY - 4, 2, 4);
    ctx.fillRect(sx + 1, gY - 5, 2, 5);
    ctx.fillRect(sx - 1, gY - 3, 2, 3);
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

function drawDeadPlayer() {
  for (const g of graves) {
    if (g.sinkT >= 2) continue; // old graves handled by drawOldGraves
    const sx = g.x - camX;
    if (sx < -60 || sx > canvas.width + 60) continue;
    const gY = groundY(g.x);
    // Active death animation — sinking body
    const sinkY = Math.min(g.sinkT * 20, 20);
    ctx.save(); ctx.translate(sx, gY + sinkY);
    ctx.globalAlpha = Math.max(0, 1 - g.sinkT);
    ctx.rotate(Math.PI/2);
    ctx.fillStyle = '#2d3748';
    ctx.beginPath(); ctx.arc(0, -25, 7, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(-4, -18, 8, 12);
    ctx.fillRect(-5, -6, 4, 10);
    ctx.fillRect(1, -6, 4, 10);
    ctx.fillRect(-8, -16, 3, 8);
    ctx.fillRect(5, -16, 3, 8);
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

// ── PARTICLES ─────────────────────────────────────────────────────────────────
let particles = [];

function addParticle(type, x, y) {
  if (particles.length >= 200) particles.shift();
  const p = { type, x, y, life: 1.0 };
  if (type === 'pollen')      { p.vx=(Math.random()-0.5)*20; p.vy=-15-Math.random()*20; p.size=2; }
  if (type === 'seed')        { p.vx=(Math.random()-0.5)*40+30; p.vy=-10-Math.random()*20; p.size=3; }
  if (type === 'autumn_leaf') { p.vx=(Math.random()-0.5)*60; p.vy=5+Math.random()*30; p.rot=Math.random()*Math.PI*2; p.rotV=(Math.random()-0.5)*4; p.size=5; p.color=`hsl(${20+Math.random()*30},80%,50%)`; }
  if (type === 'snow')        { p.vx=-15-Math.random()*20; p.vy=30+Math.random()*20; p.size=2.5; }
  if (type === 'float_text')  { p.vx=0; p.vy=-40; p.text=p.text||''; p.life=1.5; }
  if (type === 'sow_spark')   { p.vx=(Math.random()-0.5)*30; p.vy=-25-Math.random()*15; p.size=2; p.life=1.0; }
  if (type === 'tend_ring')   { p.vx=0; p.vy=0; p.r=4; p.life=1.0; }
  particles.push(p);
  return p;
}

function spawnAtmosphericParticles(dt) {
  const season = Math.floor((year%1)*4);
  // pollen in spring (use screen-space x, draw subtracts camX)
  if (season === 0 && Math.random() < dt*8) {
    const sx = Math.random()*canvas.width;
    const p2 = addParticle('pollen', 0, 0);
    p2.x = sx + camX; // world x
    p2.y = canvas.height*0.4 + Math.random()*canvas.height*0.2;
  }
  // seeds in late summer/autumn
  if ((season===1||season===2) && Math.random() < dt*5) {
    const sx = Math.random()*canvas.width;
    const p2 = addParticle('seed', 0, 0);
    p2.x = sx + camX;
    p2.y = canvas.height*0.4 + Math.random()*canvas.height*0.2;
  }
  // autumn leaves (store world x)
  if (season===2) {
    for (const p of plants) {
      const sp = SPECIES[p.speciesId];
      if (sp && sp.layer==='canopy' && Math.random() < dt*2) {
        addParticle('autumn_leaf', p.x, groundY(p.x)-sp.heightPx*0.6*(Math.min(p.age/sp.matureAge,1)));
      }
    }
  }
  // snow in winter
  if (season===3 && Math.random() < dt*15) {
    addParticle('snow', camX + Math.random()*canvas.width, -10);
  }
}

function updateParticles(dt) {
  for (let i=particles.length-1;i>=0;i--) {
    const p = particles[i];
    if (p.type==='float_text') {
      p.y += p.vy*dt; p.life -= dt*0.7;
    } else if (p.type==='sow_spark') {
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vy += 80*dt; // mild gravity
      p.life -= dt*1.3;
    } else if (p.type==='tend_ring') {
      p.r += 40*dt;
      p.life -= dt*0.9;
    } else {
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.life -= dt*0.3;
      if (p.rot!==undefined) p.rot += p.rotV*dt;
    }
    if (p.life <= 0) { particles.splice(i,1); }
  }
}

function drawParticles(layer) {
  const frontTypes = { autumn_leaf:1, snow:1, float_text:1, sow_spark:1, tend_ring:1 };
  for (const p of particles) {
    if (layer==='back'  &&  frontTypes[p.type]) continue;
    if (layer==='front' && !frontTypes[p.type]) continue;
    ctx.globalAlpha = Math.min(p.life, 1);
    if (p.type==='pollen') {
      ctx.beginPath(); ctx.arc(p.x-camX,p.y,p.size,0,Math.PI*2);
      ctx.fillStyle='#f0d040'; ctx.fill();
    } else if (p.type==='seed') {
      ctx.beginPath(); ctx.arc(p.x-camX,p.y,p.size*0.6,0,Math.PI*2);
      ctx.fillStyle='#f0f0e8'; ctx.fill();
      // wispy trail
      ctx.beginPath(); ctx.moveTo(p.x-camX,p.y);
      ctx.lineTo(p.x-camX-6,p.y+4);
      ctx.strokeStyle='rgba(240,240,230,0.5)'; ctx.lineWidth=0.8; ctx.stroke();
    } else if (p.type==='autumn_leaf') {
      ctx.save(); ctx.translate(p.x-camX,p.y); ctx.rotate(p.rot);
      ctx.beginPath();
      ctx.moveTo(0,-p.size); ctx.lineTo(p.size,0); ctx.lineTo(0,p.size); ctx.lineTo(-p.size,0);
      ctx.closePath(); ctx.fillStyle=p.color; ctx.fill();
      ctx.restore();
    } else if (p.type==='snow') {
      ctx.beginPath(); ctx.arc(p.x-camX,p.y,p.size,0,Math.PI*2);
      ctx.fillStyle='rgba(240,245,255,0.9)'; ctx.fill();
    } else if (p.type==='float_text') {
      ctx.font = 'bold 15px Segoe UI, system-ui, sans-serif';
      ctx.fillStyle = p.color||'#f0f0f0';
      ctx.textAlign = 'center';
      ctx.fillText(p.text||'', p.x, p.y);
      ctx.textAlign = 'left';
    } else if (p.type==='sow_spark') {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fillStyle = '#a7f3d0'; ctx.fill();
    } else if (p.type==='tend_ring') {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(253,230,138,0.9)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.lineWidth = 1;
    }
    ctx.globalAlpha = 1;
  }
}

// ── BACKGROUND RENDERING ──────────────────────────────────────────────────────

const skyColors = {
  0: { top:'#5b8fb9', bot:'#d4e8c2' }, // spring
  1: { top:'#1e4d78', bot:'#7bc4e2' }, // summer
  2: { top:'#8b4513', bot:'#f4a460' }, // autumn
  3: { top:'#2c3e50', bot:'#8fa9be' }, // winter
};

function lerpColor(a, b, t) {
  // parse hex
  const ah=parseInt(a.slice(1),16), bh=parseInt(b.slice(1),16);
  const ar=(ah>>16)&0xff, ag=(ah>>8)&0xff, ab=ah&0xff;
  const br=(bh>>16)&0xff, bg=(bh>>8)&0xff, bb=bh&0xff;
  const r=Math.round(ar+(br-ar)*t), g=Math.round(ag+(bg-ag)*t), b2=Math.round(ab+(bb-ab)*t);
  return `rgb(${r},${g},${b2})`;
}

function drawSky() {
  const seasonF = (year%1)*4;
  const s0 = Math.floor(seasonF)%4;
  const s1 = (s0+1)%4;
  const sf = seasonF % 1;
  const topCol = lerpColor(skyColors[s0].top, skyColors[s1].top, sf);
  const botCol = lerpColor(skyColors[s0].bot, skyColors[s1].bot, sf);
  const grad = ctx.createLinearGradient(0,0,0,canvas.height);
  grad.addColorStop(0, topCol);
  grad.addColorStop(1, botCol);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

function drawMountains() {
  const parallax = 0.08;
  const ox = -camX * parallax;
  ctx.beginPath();
  ctx.moveTo(0, canvas.height);
  const pts = [0,100,200,280,350,420,500,580,650,720,800,900,canvas.width];
  const hs = [0.35,0.18,0.28,0.12,0.32,0.22,0.15,0.30,0.20,0.25,0.14,0.28,0.35];
  ctx.moveTo(0, canvas.height*0.55);
  for (let i=0;i<pts.length;i++) {
    ctx.lineTo(pts[i]+ox%canvas.width, canvas.height*hs[i]);
  }
  ctx.lineTo(canvas.width, canvas.height*0.4);
  ctx.lineTo(canvas.width, canvas.height);
  ctx.closePath();
  ctx.fillStyle = '#1a2a3a';
  ctx.fill();
  // second layer
  ctx.beginPath();
  ctx.moveTo(0, canvas.height);
  for (let i=0;i<pts.length;i++) {
    ctx.lineTo(pts[i]+(ox*1.3)%canvas.width, canvas.height*(hs[i]+0.12));
  }
  ctx.lineTo(canvas.width, canvas.height*0.55);
  ctx.lineTo(canvas.width, canvas.height);
  ctx.closePath();
  ctx.fillStyle = '#142030';
  ctx.fill();
}

function drawHills() {
  const parallax = 0.25;
  const ox = -camX * parallax;
  ctx.beginPath();
  ctx.moveTo(-100, canvas.height);
  for (let wx=0;wx<=canvas.width+100;wx+=20) {
    const wx2 = wx + ox;
    const hy = canvas.height*0.6 + Math.sin(wx2*0.008)*40 + Math.sin(wx2*0.003)*60;
    ctx.lineTo(wx, hy);
  }
  ctx.lineTo(canvas.width+100, canvas.height);
  ctx.closePath();
  const season = Math.floor((year%1)*4);
  ctx.fillStyle = season===3 ? '#243050' : '#1e3828';
  ctx.fill();
}

function drawBgTrees() {
  if (year < 20) return;
  const parallax = 0.45;
  const alpha = Math.min((year-20)/15, 1) * 0.7;
  ctx.globalAlpha = alpha;
  const ox = -camX * parallax;
  const season = Math.floor((year%1)*4);
  for (let i=0;i<20;i++) {
    const tx = (i * 280 + ox) % (canvas.width+200) - 100;
    const th = 50 + (i*37)%60;
    const ty = canvas.height * 0.68;
    ctx.beginPath(); ctx.moveTo(tx, ty);
    ctx.lineTo(tx-15, ty-th*0.5); ctx.lineTo(tx, ty-th); ctx.lineTo(tx+15, ty-th*0.5);
    ctx.closePath();
    ctx.fillStyle = season===3 ? '#1a2530' : '#1e3020';
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawGround() {
  const season = Math.floor((year%1)*4);
  // frost tint in winter
  const soilColor = season===3 ? '#4a4a5a' : '#3d2b1f';
  const surfColor = season===3 ? '#5a5a6a' : '#4a3728';

  ctx.beginPath();
  ctx.moveTo(0, canvas.height);
  for (let sx=0;sx<=canvas.width;sx+=8) {
    const wx = sx + camX;
    ctx.lineTo(sx, groundY(wx));
  }
  ctx.lineTo(canvas.width, canvas.height);
  ctx.closePath();
  ctx.fillStyle = soilColor;
  ctx.fill();

  // surface line
  ctx.beginPath();
  for (let sx=0;sx<=canvas.width;sx+=8) {
    const wx = sx + camX;
    const y = groundY(wx);
    if (sx===0) ctx.moveTo(sx,y); else ctx.lineTo(sx,y);
  }
  ctx.strokeStyle = surfColor; ctx.lineWidth = 3; ctx.stroke();
}

// E1 — warm haze in the soil around active graves (nutrientT < 20).
function drawGraveNutrient() {
  for (const g of graves) {
    if (g.nutrientT >= 20) continue;
    const sx = g.x - camX;
    if (sx < -200 || sx > canvas.width + 200) continue;
    const gY = groundY(g.x);
    const fade = 1 - g.nutrientT / 20; // strongest right after death, fades over 20 years
    const grad = ctx.createRadialGradient(sx, gY + 10, 0, sx, gY + 10, 150);
    grad.addColorStop(0, `rgba(200,140,60,${0.3 * fade})`);
    grad.addColorStop(0.5, `rgba(160,100,40,${0.14 * fade})`);
    grad.addColorStop(1, 'rgba(140,90,40,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(sx - 150, gY - 30, 300, 90);
  }
}

// Soft-glow network drawn into the soil layer. Sits on top of the ground
// fill but reads as underground because the mycelial overlay has already
// darkened the soil to near-black. Lines pulse subtly with sin(t).
function drawMycelium() {
  if (mycelialT <= 0 || myceliumEdges.length === 0) return;
  const pulse = 0.75 + 0.25 * Math.sin(performance.now() * 0.002);
  ctx.save();
  for (const e of myceliumEdges) {
    const axS = e.ax - camX, bxS = e.bx - camX;
    if ((axS < -240 && bxS < -240) ||
        (axS > canvas.width + 240 && bxS > canvas.width + 240)) continue;
    const a = mycelialT * pulse;
    if (e.type === 'ecto') {
      ctx.strokeStyle = `rgba(220,180,80,${0.35 * a})`;
      ctx.shadowColor = 'rgba(220,180,80,0.55)';
      ctx.shadowBlur  = 6;
    } else if (e.type === 'shoot') {
      // Root tendrils — warmer, earthier copper.
      ctx.strokeStyle = `rgba(190,140,90,${0.40 * a})`;
      ctx.shadowColor = 'rgba(190,140,90,0.50)';
      ctx.shadowBlur  = 3;
    } else {
      ctx.strokeStyle = `rgba(120,160,220,${0.25 * a})`;
      ctx.shadowColor = 'rgba(120,160,220,0.45)';
      ctx.shadowBlur  = 4;
    }
    ctx.lineWidth = 0.7 + 2.0 * e.strength;
    ctx.beginPath();
    ctx.moveTo(axS, e.ay);
    if (e.type === 'shoot') {
      // Slight organic kink, perpendicular to the shoot's own axis so
      // near-vertical roots don't loop the way a pure y-sag would.
      const dx = bxS - axS, dy = e.by - e.ay;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len; // perpendicular unit
      const wobble = (prand(e.seed | 0, 7) - 0.5) * Math.min(14, len * 0.25);
      const midX = (axS + bxS) / 2 + nx * wobble;
      const midY = (e.ay + e.by) / 2 + ny * wobble;
      ctx.quadraticCurveTo(midX, midY, bxS, e.by);
    } else {
      // Gentle downward arc — long edges sag deeper into the soil.
      const midX = (axS + bxS) / 2;
      const midY = (e.ay + e.by) / 2 + 18 + Math.abs(e.ax - e.bx) * 0.08;
      ctx.quadraticCurveTo(midX, midY, bxS, e.by);
    }
    ctx.stroke();
  }
  ctx.restore();
}

// ── MYCELIAL FLOW PARTICLES ───────────────────────────────────────────────────
// Small glowing orbs that travel along ecto (fungus↔tree) and root
// (tree↔tree) edges, suggesting nutrient / signal flow. They follow the
// same quadratic bezier curve as the drawn edges so they stay on the line.
const MYC_PARTICLE_CAP = 48;
const MYC_SPAWN_RATE   = 4;   // new particles per real second at full mycelialT

function updateMycParticles(dt) {
  if (mycelialT <= 0) { mycParticles.length = 0; _mycSpawnAccum = 0; return; }

  // Advance each particle along its edge; retire when it exits [0,1].
  for (let i = mycParticles.length - 1; i >= 0; i--) {
    const p = mycParticles[i];
    p.t += p.speed * dt;
    if (p.t > 1 || p.t < 0) mycParticles.splice(i, 1);
  }

  // Only spawn on ecto and root edges — shoots are too short.
  const eligible = myceliumEdges.filter(e => e.type === 'ecto' || e.type === 'root');
  if (eligible.length === 0) return;

  _mycSpawnAccum += MYC_SPAWN_RATE * dt * mycelialT;
  while (_mycSpawnAccum >= 1 && mycParticles.length < MYC_PARTICLE_CAP) {
    _mycSpawnAccum -= 1;
    const e   = eligible[Math.floor(Math.random() * eligible.length)];
    const rev = Math.random() < 0.5;
    mycParticles.push({
      edge:  e,
      t:     rev ? 0.95 + Math.random() * 0.05 : Math.random() * 0.05,
      speed: (0.055 + Math.random() * 0.07) * (rev ? -1 : 1),
    });
  }
  if (_mycSpawnAccum > 2) _mycSpawnAccum = 0;
}

function drawMycParticles() {
  if (mycelialT <= 0 || mycParticles.length === 0) return;
  ctx.save();
  for (const p of mycParticles) {
    const e = p.edge;
    const t = Math.max(0, Math.min(1, p.t));
    // Control point — must match drawMycelium exactly.
    const midX = (e.ax + e.bx) / 2;
    const midY = (e.ay + e.by) / 2 + 18 + Math.abs(e.ax - e.bx) * 0.08;
    const u  = 1 - t;
    const wx = u*u*e.ax + 2*u*t*midX + t*t*e.bx;
    const wy = u*u*e.ay + 2*u*t*midY + t*t*e.by;
    const sx = wx - camX;
    if (sx < -20 || sx > canvas.width + 20) continue;
    // Fade in/out near the ends of each edge so particles don't pop.
    const edgeFade = Math.min(t * 8, (1 - t) * 8, 1);
    const alpha    = mycelialT * edgeFade * (0.55 + 0.45 * e.strength);
    if (e.type === 'ecto') {
      ctx.fillStyle   = `rgba(255,215,90,${alpha})`;
      ctx.shadowColor = 'rgba(255,200,60,0.9)';
    } else {
      ctx.fillStyle   = `rgba(140,190,255,${alpha})`;
      ctx.shadowColor = 'rgba(120,165,245,0.9)';
    }
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(sx, wy, 2.0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// C4 — the walking figure becomes a soft glowing node + fading trail
// while the mycelial view is active. Drawn at full alpha *over* the
// dimmed body so the player crossfades from human to node as mycelialT
// rises. Movement controls are unchanged.
function drawPlayerMycelial() {
  if (mycelialT <= 0.01) return;
  const a = mycelialT;
  // Trailing threads — fade with each sample's age.
  for (let i = 1; i < playerTrail.length; i++) {
    const p0 = playerTrail[i - 1], p1 = playerTrail[i];
    const fade = 1 - (p1.age / TRAIL_LIFE);
    if (fade <= 0) continue;
    ctx.strokeStyle = `rgba(220,180,80,${0.45 * fade * a})`;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(p0.x - camX, p0.y);
    ctx.lineTo(p1.x - camX, p1.y);
    ctx.stroke();
  }
  // Glowing node where the body is.
  const sx = (player.dead ? player.deathX : player.x) - camX;
  const sy = (player.dead ? player.deathY : groundY(player.x)) - 14;
  const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, 26);
  grad.addColorStop(0,   `rgba(255,235,180,${0.75 * a})`);
  grad.addColorStop(0.4, `rgba(220,180,80,${0.32 * a})`);
  grad.addColorStop(1,   'rgba(220,180,80,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(sx - 30, sy - 30, 60, 60);
  // Bright core
  ctx.beginPath(); ctx.arc(sx, sy, 3.5, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(255,250,235,${a})`;
  ctx.fill();
}

// ── F1 — BEHAVIOUR SIGNATURE ──────────────────────────────────────────────────
// Reads the ledger and returns a profile of the player's stance toward the
// forest. Never displayed. Used only to tint the reflection lines.
function behaviourSig() {
  const { took, gave, listened, lifeStart } = player.ledger;
  const total = took + gave + listened;
  const lifeTime = Math.max(1, year - lifeStart); // avoid /0
  // Time alive without any action → indifference.
  const actionTime = total;  // rough proxy: one action ≈ one unit of engagement
  const indifference = Math.max(0, 1 - actionTime / (lifeTime * 0.15));
  if (total < 3) return { dominion: 0, stewardship: 0, participation: 0, indifference, mode: 'novice' };
  const dominion      = took / total;
  const stewardship   = gave / total;
  const participation = listened / total;
  // Dominant mode is whichever ratio is highest (ties break in cascade order).
  let mode = 'novice';
  const hi = Math.max(dominion, stewardship, participation, indifference);
  if      (hi === dominion)      mode = 'dominion';
  else if (hi === stewardship)   mode = 'stewardship';
  else if (hi === participation) mode = 'participation';
  else                           mode = 'indifference';
  return { dominion, stewardship, participation, indifference, mode };
}

// ── D2 — REFLECTION LINES ────────────────────────────────────────────────────
// Every ~30 real-time seconds, the sim may emit a single passing observation
// about the player's behaviour. At most one per check. Not compliments, not
// accusations. Tone: an old person noticing weather.
const REFLECT_INTERVAL  = 60;    // real-time seconds between checks
const REFLECT_DURATION  = 6;     // fade-in / hold / fade-out total
const REFLECT_CHANCE    = 0.40;  // probability of emitting when a D2 rule matches
const SIG_CHANCE        = 0.40;  // signature (F2) lines — same weight as D2
let _reflectTimer       = REFLECT_INTERVAL;
let _reflectText        = '';
let _reflectT           = 0;     // seconds remaining in the 6-s cycle
// Canopy-stability tracker for the "forest does not need you" line.
let _coverStableYears   = 0;
let _prevCover          = 0;

// D2 line banks — each rule picks randomly so repeat plays feel different.
const REFLECT_POOLS = {
  observer: [   // long life, no actions at all
    'you have walked without taking. the forest notices nothing.',
    'you have been here a long time without asking anything of it.',
    'the forest does not know you are watching.',
    'you move through it. it continues.',
    'you are here. it is also here. nothing has been exchanged.',
  ],
  taker: [      // took dominates strongly
    'the forest feels your hunger.',
    'every gap you make becomes something else\'s chance.',
    'what you removed was here before you arrived.',
    'the clearing widens. something will grow into it.',
    'you have eaten. the forest does not count.',
    'hunger is honest. the forest does not judge it.',
  ],
  giver: [      // gave dominates and exceeds took
    'the forest is becoming what you hoped for.',
    'you are planting your preferences. the forest does not mind.',
    'some of what you sowed will outlive this century.',
    'you are tending what does not need a tender. it grows anyway.',
    'the things you planted may not remember you planted them.',
    'the forest is also shaping itself, with or without you.',
  ],
  listener: [   // listened dominates
    'you have been quiet. the trees are louder than they were.',
    'you sat with it. it continued.',
    'the listening has not changed anything. that is not why you listened.',
    'some of what you heard was not meant for you.',
    'you have asked nothing of it. it has offered nothing back. that is a kind of conversation.',
    'the quiet here is not empty.',
  ],
  returned: [   // multiple deaths
    'you have returned before. the soil remembers you.',
    'this is not the first time you have stood here.',
    'the foxglove grew from your last body. it is gone now.',
    'you have started again. the forest has not started again.',
    'three times you have come back. the lichen did not notice.',
    'you keep returning. the forest is not waiting for you.',
  ],
  stable: [     // canopy stable for a long stretch
    'the forest does not need you to continue.',
    'it was doing this before you arrived.',
    'succession continues whether or not you watch.',
    'the forest is finishing a sentence it began before your grandparents.',
    'this is not paused. it is simply slow.',
  ],
};

// F2 signature-tinted pools — keyed to dominant stance.
const SIG_POOLS = {
  dominion: [
    'the forest does not fight you. it does not fight anything.',
    'you have shaped this. the forest will outlast the shape.',
    'what you cleared will fill in. it always does.',
    'nothing you have removed is gone. it is elsewhere.',
    'the forest has its own direction. you have given it another one for now.',
  ],
  stewardship: [
    'you are shaping. the forest is also shaping itself.',
    'you have decided what belongs here. the forest has also decided.',
    'the things you tended are tending themselves now.',
    'a garden is one thing the forest might become. it has become others.',
    'you are one of the forces acting on this place. not the only one.',
  ],
  participation: [
    'your edges are quieter than they were.',
    'you have been listening long enough that the sound has changed.',
    'you are one of the things that lives here.',
    'at some point you stopped being a visitor. you may not have noticed.',
    'the forest does not distinguish you from the rest of what moves through it.',
    'something is different about how you are standing.',
  ],
  indifference: [
    'something is here without you. you have not asked what.',
    'the forest does not require your attention to continue.',
    'you are here and not here at the same time.',
    'things are happening that you are not watching.',
    'the forest has been indifferent to indifferent things for longer than it has had trees.',
  ],
};

function _pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function checkReflection(dt) {
  // Track canopy-cover stability (considered stable if change < 0.03/year).
  const cover = getCanopyCover();
  const coverDelta = Math.abs(cover - _prevCover);
  const yearDelta = dt * speed;
  if (yearDelta > 0 && coverDelta / yearDelta < 0.03) {
    _coverStableYears += yearDelta;
  } else {
    _coverStableYears = 0;
  }
  _prevCover = cover;

  // Only check while alive — dead players don't need pep talks.
  if (player.dead) return;
  _reflectTimer -= dt;
  if (_reflectTimer > 0 || _reflectT > 0) return;
  _reflectTimer = REFLECT_INTERVAL;

  const { took, gave, listened, died, lifeStart } = player.ledger;
  const lifeDuration = year - lifeStart;
  const total = took + gave + listened;

  // Ratios — safe even when total is 0.
  const tookR      = total > 0 ? took / total      : 0;
  const gaveR      = total > 0 ? gave / total      : 0;
  const listenedR  = total > 0 ? listened / total  : 0;

  // D2: first-match cascade using ratios (not absolute counts).
  // "total >= 3" guards against noise in the first few actions.
  let d2Pool = null;
  if (lifeDuration > 20 && total === 0) {
    d2Pool = REFLECT_POOLS.observer;
  } else if (total >= 3 && tookR >= 0.55 && gaveR < 0.15) {
    d2Pool = REFLECT_POOLS.taker;
  } else if (total >= 3 && gaveR >= 0.45 && gave > took) {
    d2Pool = REFLECT_POOLS.giver;
  } else if (total >= 3 && listenedR >= 0.45) {
    d2Pool = REFLECT_POOLS.listener;
  } else if (died >= 3) {
    d2Pool = REFLECT_POOLS.returned;
  } else if (_coverStableYears >= 30) {
    d2Pool = REFLECT_POOLS.stable;
  }

  // F2: signature-tinted lines — computed each cycle regardless of D2.
  const sig = behaviourSig();
  let f2Pool = null;
  if (sig.mode !== 'novice') {
    if      (sig.dominion > 0.45)      f2Pool = SIG_POOLS.dominion;
    else if (sig.stewardship > 0.40)   f2Pool = SIG_POOLS.stewardship;
    else if (sig.participation > 0.40) f2Pool = SIG_POOLS.participation;
    else if (sig.indifference > 0.55)  f2Pool = SIG_POOLS.indifference;
  }

  // Decide what to emit: if both D2 and F2 have a candidate, give F2 a
  // genuine ~35% share of the roll so signature lines actually appear.
  let chosenPool = null;
  if (d2Pool && f2Pool) {
    chosenPool = Math.random() < 0.35 ? f2Pool : d2Pool;
  } else {
    chosenPool = d2Pool || f2Pool;
  }

  if (!chosenPool) {
    // Nothing matched — re-check sooner.
    _reflectTimer = 15;
    return;
  }

  const chance = (chosenPool === f2Pool && !d2Pool) ? SIG_CHANCE : REFLECT_CHANCE;
  if (Math.random() < chance) {
    _reflectText = _pick(chosenPool);
    _reflectT = REFLECT_DURATION;
  }
}

function drawReflection() {
  if (_reflectT <= 0 || !_reflectText) return;
  const elapsed = REFLECT_DURATION - _reflectT;
  let alpha;
  if (elapsed < 1.0)      alpha = elapsed;            // 1 s fade in
  else if (elapsed < 5.0) alpha = 1;                  // 4 s hold
  else                    alpha = REFLECT_DURATION - elapsed; // 1 s fade out
  alpha = Math.max(0, Math.min(1, alpha));
  if (alpha <= 0.01) return;
  ctx.font = 'italic 18px Georgia, "Times New Roman", serif';
  ctx.fillStyle = `rgba(203,213,225,${alpha * 0.85})`;
  ctx.textAlign = 'center';
  ctx.fillText(_reflectText, canvas.width / 2, canvas.height - 70);
  ctx.textAlign = 'left';
}

// ── D3 — END-OF-AGE REFLECTION ───────────────────────────────────────────────
// Once per browser session, after the forest reaches climax (cover ≥ 0.8 for
// 20 consecutive in-game years) OR after 5 deaths, the screen fades to
// near-black and a quiet modal appears. No score. No judgement.
let _endReflected = localStorage.getItem('forest_reflected') === '0';
let _climaxYears  = 0;

function numberWord(n) {
  const w = ['zero','once','twice','three','four','five','six','seven',
             'eight','nine','ten','eleven','twelve'];
  return n <= 12 ? w[n] : String(n);
}
function timesWord(n) {
  if (n === 0) return 'never';
  if (n === 1) return 'once';
  if (n === 2) return 'twice';
  return numberWord(n) + ' times';
}

function checkEndReflection(dt) {
  if (_endReflected) return;
  if (player.dead) return;

  // Track climax duration: cover ≥ 0.8.
  const cover = getCanopyCover();
  const yearDelta = dt * speed;
  if (cover >= 0.8 && yearDelta > 0) { _climaxYears += yearDelta; if (_climaxYears >= 20) noteClimax(); }
  else if (cover < 0.75) _climaxYears = 0;  // small hysteresis

  const trigger = _climaxYears >= 20 || player.ledger.died >= 5;
  if (!trigger) return;

  _endReflected = true;
  try { localStorage.setItem('forest_reflected', '1'); } catch(e) {}

  // Build prose summary from session-wide totals (not per-life counters).
  const totalYears = Math.floor(year);
  const { totalTook, totalGave, totalListened, died } = player.ledger;

  let summary = `You walked here for ${totalYears} year${totalYears !== 1 ? 's' : ''}.`;
  if (totalTook > 0)     summary += ` You ate ${timesWord(totalTook)}.`;
  if (totalGave > 0)     summary += ` You planted or tended ${timesWord(totalGave)}.`;
  if (totalListened > 0) summary += ` You listened ${timesWord(totalListened)}.`;
  if (died > 0)          summary += ` You died ${timesWord(died)} and came back ${timesWord(died)}.`;

  const overlay = document.getElementById('reflect-overlay');
  overlay.querySelector('.reflect-summary').textContent = summary;
  overlay.querySelector('.reflect-question').textContent =
    'What is your relationship to this place?';
  overlay.querySelector('.reflect-dismiss').textContent =
    '(no answer required. the forest does not keep a record.)';

  // Fade in.
  requestAnimationFrame(() => overlay.classList.add('visible'));

  // Dismiss only via the explicit button (or Enter/Space on it).
  const btn = overlay.querySelector('.reflect-continue');
  const dismiss = () => {
    overlay.classList.remove('visible');
    setTimeout(() => { overlay.style.display = 'none'; }, 1800);
    btn.removeEventListener('click', dismiss);
  };
  btn.addEventListener('click', dismiss);
}

// C5 — single contextual line that fades in/out across the top centre,
// shown once per entry into the mycelial view (manual or by death).
function drawMycelialText() {
  if (mycelialLineT <= 0 || !mycelialLineText) return;
  const elapsed = MYCELIAL_LINE_DURATION - mycelialLineT;
  let alpha;
  if (elapsed < 1.0)      alpha = elapsed;            // 1 s fade in
  else if (elapsed < 5.0) alpha = 1;                  // 4 s hold
  else                    alpha = (MYCELIAL_LINE_DURATION - elapsed); // 1 s fade out
  alpha = Math.max(0, Math.min(1, alpha)) * Math.min(1, mycelialT * 1.2);
  if (alpha <= 0.01) return;
  ctx.font = 'italic 22px Georgia, "Times New Roman", serif';
  ctx.fillStyle = `rgba(220,210,255,${alpha})`;
  ctx.textAlign = 'center';
  ctx.fillText(mycelialLineText, canvas.width / 2, 80);
  ctx.textAlign = 'left';
}

// ── INFO CARD ─────────────────────────────────────────────────────────────────
const infoCard = document.getElementById('info-card');
let infoOpen = false;

function showInfoCard(species, plantObj) {
  if (species.id && plantObj) noteNewSpecies(species);
  document.getElementById('info-name').textContent = species.name;
  document.getElementById('info-latin').textContent = species.latin;
  document.getElementById('info-desc').textContent = species.info;
  const edDiv = document.getElementById('info-edible');
  if (species.edible) {
    if (species.edible.poisonous) {
      edDiv.className='bad';
      edDiv.innerHTML=`✦ Toxic: ${species.edible.part}<br><em>${species.edible.flavor}</em>`;
    } else {
      edDiv.className='good';
      edDiv.innerHTML=`✦ Edible: ${species.edible.part}<br><em>${species.edible.flavor}</em>`;
    }
    edDiv.style.display='block';
  } else {
    edDiv.style.display='none';
  }
  // Persistence line — how this being carries itself through time.
  const pDiv = document.getElementById('info-persistence');
  if (species.persistence) {
    const pill = pDiv.querySelector('.pill');
    const note = pDiv.querySelector('.pnote');
    pill.className = 'pill ' + species.persistence.strategy;
    pill.textContent = species.persistence.strategy;
    note.textContent = species.persistence.note;
    pDiv.style.display = 'block';
  } else {
    pDiv.style.display = 'none';
  }
  // Harvest button — all plants are interactable
  const harvestBtn      = document.getElementById('info-harvest');
  const harvestMoneyBtn = document.getElementById('info-harvest-money');
  const cutdownBtn      = document.getElementById('info-cutdown');
  const tendBtn         = document.getElementById('info-tend');
  const listenBtn       = document.getElementById('info-listen');
  harvestMoneyBtn.style.display = 'none';
  if (plantObj && species.listen && species.listen.length > 0) {
    listenBtn.style.display = 'block';
    listenBtn.onclick = () => { startListening(species, plantObj); };
  } else {
    listenBtn.style.display = 'none';
  }
  if (plantObj) {
    const isCanopy = species.layer === 'canopy';
    if (isCanopy) {
      // Canopy trees: separate Harvest (money) and Eat buttons.
      harvestMoneyBtn.style.display = 'block';
      harvestMoneyBtn.textContent = 'Harvest';
      harvestMoneyBtn.className = 'neutral';
      harvestMoneyBtn.onclick = () => {
        const idx = plants.indexOf(plantObj);
        if (idx !== -1) plants.splice(idx, 1);
        disturb(plantObj);
        player.ledger.took++; player.ledger.totalTook++;
        const val = species.moneyValue || 50;
        player.money += val;
        player.moneyGlowT = 2.0;
        const sx2 = plantObj.x - camX, sy2 = groundY(plantObj.x);
        showFloatText('Felled!', sx2, sy2-30, '#94a3b8');
        showFloatText(`+$${val}`, sx2, sy2-54, '#fbbf24');
        for (let i = 0; i < 6; i++) {
          const pk = addParticle('float_text', 0, 0);
          pk.x = sx2 + (Math.random()-0.5)*40; pk.y = sy2 - 30 - Math.random()*30;
          pk.text = '$'; pk.color = '#fbbf24'; pk.vx = (Math.random()-0.5)*30; pk.vy = -60 - Math.random()*40; pk.life = 1.2;
        }
        hideInfoCard();
      };
      if (species.eatLabel && species.edible) {
        harvestBtn.textContent = species.eatLabel;
        harvestBtn.className = 'good';
        harvestBtn.style.display = 'block';
        harvestBtn.onclick = () => {
          eatPlant(plantObj, species, plantObj.x - camX, groundY(plantObj.x));
          hideInfoCard();
        };
      } else {
        harvestBtn.style.display = 'none';
      }
      cutdownBtn.style.display = 'none';
    } else if (species.edible) {
      harvestBtn.textContent = species.edible.poisonous ? 'Eat anyway' : 'Harvest & eat';
      harvestBtn.className = species.edible.poisonous ? 'bad' : 'good';
      harvestBtn.style.display = 'block';
      harvestBtn.onclick = () => {
        eatPlant(plantObj, species, plantObj.x - camX, groundY(plantObj.x));
        hideInfoCard();
      };
      if (species.edible.poisonous) {
        cutdownBtn.textContent = 'Remove';
        cutdownBtn.style.display = 'block';
        cutdownBtn.onclick = () => {
          const idx = plants.indexOf(plantObj);
          if (idx !== -1) plants.splice(idx, 1);
          disturb(plantObj);
          player.ledger.took++; player.ledger.totalTook++;
          const sx2 = plantObj.x - camX, sy2 = groundY(plantObj.x);
          showFloatText('Removed', sx2, sy2-30, '#94a3b8');
          hideInfoCard();
        };
      } else {
        cutdownBtn.style.display = 'none';
      }
    } else {
      harvestBtn.textContent = 'Remove';
      harvestBtn.className = 'neutral';
      harvestBtn.style.display = 'block';
      harvestBtn.onclick = () => {
        eatPlant(plantObj, species, plantObj.x - camX, groundY(plantObj.x));
        hideInfoCard();
      };
      cutdownBtn.style.display = 'none';
    }
    // Tend — only while the plant is a seedling (< 30% of mature age).
    const isSeedling = species.matureAge && plantObj.age < species.matureAge * 0.3;
    if (isSeedling) {
      tendBtn.style.display = 'block';
      tendBtn.onclick = () => {
        const sx2 = plantObj.x - camX, sy2 = groundY(plantObj.x);
        const lastTend = plantObj.lastTendYear;
        if (lastTend !== undefined && (year - lastTend) < 1) {
          showFloatText('not yet — give it a year', sx2, sy2-30, '#cbd5e1');
          hideInfoCard();
          return;
        }
        plantObj.age += 0.5;
        plantObj.lastTendYear = year;
        player.ledger.gave++; player.ledger.totalGave++;
        // Ring of light around the seedling.
        const ring = addParticle('tend_ring', 0, 0);
        ring.x = sx2; ring.y = sy2 - 8;
        showFloatText('tended', sx2, sy2-30, '#5eead4');
        hideInfoCard();
      };
    } else {
      tendBtn.style.display = 'none';
    }
  } else {
    harvestBtn.style.display  = 'none';
    cutdownBtn.style.display  = 'none';
    tendBtn.style.display     = 'none';
  }
  infoCard.classList.add('visible');
  infoOpen = true;
}

function hideInfoCard() {
  infoCard.classList.remove('visible');
  infoOpen = false;
}

// E2 — grave info card: a small reflection on how you lived.
function graveStatement(g) {
  const { took, gave, listened } = g.ledger;
  const total = took + gave + listened;
  if (total === 0) return 'you did nothing here. the ground took you anyway.';
  if (listened > took && listened > gave) return 'you listened to the trees more than you took from them.';
  if (gave > took) return 'you gave more than you took.';
  if (took > 0 && gave === 0 && listened === 0) return 'you were hungry. the forest fed you.';
  if (took > gave && listened > 0) return 'you took, and sometimes you listened.';
  return 'you were here for a while.';
}

function showGraveCard(g) {
  document.getElementById('info-name').textContent = 'A grave';
  document.getElementById('info-latin').textContent = `year ${g.year}`;
  document.getElementById('info-desc').textContent = 'you died here. ' + graveStatement(g);
  document.getElementById('info-edible').style.display = 'none';
  document.getElementById('info-persistence').style.display = 'none';
  document.getElementById('info-listen').style.display = 'none';
  document.getElementById('info-harvest').style.display = 'none';
  document.getElementById('info-cutdown').style.display = 'none';
  document.getElementById('info-tend').style.display = 'none';
  infoCard.classList.add('visible');
  infoOpen = true;
}

  // Track background
  ctx.fillStyle = 'rgba(51,65,85,0.8)';
  roundRect(ctx, trackX, trackY, trackW, trackH, 3);
  // Filled portion
  const FREQ_MIN = 0.1, FREQ_MAX = 3.0;
  const frac = (FREQ_SCALE - FREQ_MIN) / (FREQ_MAX - FREQ_MIN);
  ctx.fillStyle = 'rgba(56,189,248,0.5)';

  ctx.beginPath(); ctx.arc(thumbX, trackY + trackH / 2, 7, 0, Math.PI * 2);
  ctx.fillStyle = '#38bdf8'; ctx.fill();
  // Store bounds for drag hit-testing
  _freqSliderBounds = { x: trackX, y: trackY - 6, w: trackW, h: trackH + 12 };
}

// ── Biodiversity log — press `b` to dump per-species population to console ───
let _bioLog = []; // array of { year, counts: { speciesId: n } }

function coverToEra(succession) {
  if (succession >= 0.88) return 'climax';
  if (succession >= 0.68) return 'late';
  if (succession >= 0.45) return 'mid';
  if (succession >= 0.20) return 'early';
  return plants.length > 0 ? 'pioneer' : 'bare';
}

function sampleBiodiversity() {
  const counts = {};
  for (const id in SPECIES) counts[id] = 0;
  for (const p of plants) counts[p.speciesId] = (counts[p.speciesId] || 0) + 1;
  for (const f of fungi) counts[f.speciesId] = (counts[f.speciesId] || 0) + 1;
  const cover = getCanopyCover();
  // Per-species cover: allocate global cover proportionally by height-weighted
  // biomass. A 300px canopy tree contributes far more area than a 20px herb,
  // so weighting by heightPx makes canopy-dominant climax curves achievable.
  let totalWeight = 0;
  const weights = {};
  for (const p of plants) {
    const sp = SPECIES[p.speciesId]; if (!sp) continue;
    const w = (sp.heightPx || 1) * Math.min(p.age / sp.matureAge, 1);
    weights[p.speciesId] = (weights[p.speciesId] || 0) + w;
    totalWeight += w;
  }
  for (const f of fungi) {
    const sp = SPECIES[f.speciesId]; if (!sp) continue;
    const w = (sp.heightPx || 1) * Math.min(f.age / sp.matureAge, 1);
    weights[f.speciesId] = (weights[f.speciesId] || 0) + w;
    totalWeight += w;
  }
  const speciesCover = {};
  for (const id in SPECIES) {
    speciesCover[id] = totalWeight > 0 ? ((weights[id] || 0) / totalWeight) * cover : 0;
  }
  _bioLog.push({ year: Math.round(year), cover, era: coverToEra(cover), soil: averageSoil(), counts, speciesCover });
}

function logBiodiversity() {
  // Take a fresh sample first.
  sampleBiodiversity();
  // Output as CSV — console.table truncates wide tables in most browsers.
  const ids = Object.keys(SPECIES);
  const header = ['year', 'cover', 'era', 'soil', ...ids].join('\t');
  const lines = _bioLog.map(s =>
    [s.year, s.cover.toFixed(3), s.era, s.soil.toFixed(3), ...ids.map(id => s.counts[id] || 0)].join('\t')
  );
  console.log(`── Biodiversity log (${_bioLog.length} samples) — copy and paste into a spreadsheet ──\n${header}\n${lines.join('\n')}`);
}

// ── POPULATION GRAPH ──────────────────────────────────────────────────────────

const GRAPH_LAYER_COLOURS = {
  ground:  '#86efac',
  shrub:   '#a78bfa',
  canopy:  '#5eead4',
  fungal:  '#fbbf24',
};

const GRAPH_ERA_COLOURS = {
  bare:    'rgba(160,140,110,0.10)',
  pioneer: 'rgba(180,155,90,0.10)',
  early:   'rgba(90,170,75,0.09)',
  mid:     'rgba(45,130,65,0.10)',
  late:    'rgba(30,105,85,0.10)',
  climax:  'rgba(20,65,85,0.13)',
};

function drawGraph() {
  if (!_graphOpen) return;
  const gc = document.getElementById('graph-canvas');
  const body = document.getElementById('graph-body');
  if (!gc || !body) return;
  const W = body.offsetWidth, H = body.offsetHeight;
  const sizeChanged = gc.width !== W || gc.height !== H;
  if (!sizeChanged && _bioLog.length === _lastGraphLogLen) return;
  if (W < 1 || H < 40) { _lastGraphLogLen = -1; return; }
  gc.width = W; gc.height = H;
  _lastGraphLogLen = _bioLog.length;

  const gx = gc.getContext('2d');
  gx.clearRect(0, 0, W, H);

  if (_bioLog.length < 2) {
    gx.fillStyle = '#374151';
    gx.font = 'italic 11px Segoe UI, system-ui, sans-serif';
    gx.textAlign = 'center';
    gx.textBaseline = 'middle';
    gx.fillText('No data yet — the record fills as years pass.', W / 2, H / 2);
    return;
  }

  const PAD_L = 34, PAD_R = 18, PAD_T = 14, PAD_B = 22;
  const gW = W - PAD_L - PAD_R;
  const gH = H - PAD_T - PAD_B;
  const maxYear = _bioLog[_bioLog.length - 1].year || 1;

  function toX(yr) { return PAD_L + (yr / maxYear) * gW; }
  function toY(count, maxY) { return PAD_T + gH - (count / maxY) * gH; }

  // Build series
  let series = [];
  if (_graphLayer === 'all') {
    for (const layer of ['canopy', 'shrub', 'ground', 'fungal']) {
      const data = _bioLog.map(snap => {
        let sum = 0;
        for (const [sid, n] of Object.entries(snap.counts)) {
          if (SPECIES[sid] && SPECIES[sid].layer === layer) sum += n;
        }
        return sum;
      });
      if (data.some(v => v > 0))
        series.push({ label: layer.charAt(0).toUpperCase() + layer.slice(1), colour: GRAPH_LAYER_COLOURS[layer], data });
    }
  } else {
    const speciesInLayer = Object.entries(SPECIES).filter(([, sp]) => sp.layer === _graphLayer);
    const n = speciesInLayer.length;
    speciesInLayer.forEach(([sid, sp], i) => {
      const data = _bioLog.map(snap => snap.counts[sid] || 0);
      if (!data.some(v => v > 0)) return;
      const hue = (160 + i * (300 / Math.max(n, 1))) % 360;
      series.push({ label: sp.name, colour: `hsl(${hue},55%,62%)`, data });
    });
  }

  const maxY = Math.max(1, ...series.map(s => Math.max(...s.data)));

  // Era bands
  let eraStart = 0;
  for (let i = 1; i <= _bioLog.length; i++) {
    const atEnd = i === _bioLog.length;
    if (atEnd || _bioLog[i].era !== _bioLog[eraStart].era) {
      const bandEra = _bioLog[eraStart].era;
      const x1 = toX(_bioLog[eraStart].year);
      const x2 = atEnd ? PAD_L + gW : toX(_bioLog[i].year);
      gx.fillStyle = GRAPH_ERA_COLOURS[bandEra] || 'rgba(100,100,100,0.06)';
      gx.fillRect(x1, PAD_T, Math.max(x2 - x1, 1), gH);
      if (x2 - x1 > 24) {
        gx.fillStyle = '#2d3748';
        gx.font = '8px Segoe UI, system-ui, sans-serif';
        gx.textAlign = 'left';
        gx.textBaseline = 'top';
        gx.fillText(bandEra.toUpperCase(), x1 + 3, PAD_T + 2);
      }
      eraStart = i;
    }
  }

  // Horizontal grid lines
  const yStep = Math.ceil(maxY / 4);
  gx.strokeStyle = 'rgba(45,55,72,0.7)';
  gx.lineWidth = 0.5;
  for (let v = 0; v <= maxY; v += yStep) {
    const y = toY(v, maxY);
    gx.beginPath(); gx.moveTo(PAD_L, y); gx.lineTo(PAD_L + gW, y); gx.stroke();
    gx.fillStyle = '#374151';
    gx.font = '8px Segoe UI, monospace, sans-serif';
    gx.textAlign = 'right';
    gx.textBaseline = 'middle';
    gx.fillText(v, PAD_L - 3, y);
  }

  // Vertical grid lines every 25 years
  const yearStep = maxYear <= 50 ? 10 : maxYear <= 150 ? 25 : 50;
  for (let yr = 0; yr <= maxYear; yr += yearStep) {
    const x = toX(yr);
    gx.strokeStyle = 'rgba(45,55,72,0.5)';
    gx.lineWidth = 0.5;
    gx.beginPath(); gx.moveTo(x, PAD_T); gx.lineTo(x, PAD_T + gH); gx.stroke();
    gx.fillStyle = '#374151';
    gx.font = '8px Segoe UI, monospace, sans-serif';
    gx.textAlign = 'center';
    gx.textBaseline = 'top';
    gx.fillText(yr, x, PAD_T + gH + 4);
  }

  // Data lines
  for (const s of series) {
    gx.beginPath();
    gx.strokeStyle = s.colour;
    gx.lineWidth = 1.5;
    gx.globalAlpha = 0.80;
    let first = true;
    for (let i = 0; i < _bioLog.length; i++) {
      const x = toX(_bioLog[i].year);
      const y = toY(s.data[i], maxY);
      if (first) { gx.moveTo(x, y); first = false; } else gx.lineTo(x, y);
    }
    gx.stroke();
    gx.globalAlpha = 1;
  }

  // "Now" dashed marker
  const nowX = toX(maxYear);
  gx.strokeStyle = 'rgba(100,116,139,0.25)';
  gx.lineWidth = 1;
  gx.setLineDash([2, 4]);
  gx.beginPath(); gx.moveTo(nowX, PAD_T); gx.lineTo(nowX, PAD_T + gH); gx.stroke();
  gx.setLineDash([]);

  // Legend — stacked top-right inside the graph area
  if (series.length > 0) {
    const swatchSize = 7;
    const lineH = 13;
    const legendX = PAD_L + gW - 4;
    gx.font = '9px Segoe UI, system-ui, sans-serif';
    gx.textAlign = 'right';
    gx.textBaseline = 'middle';
    series.forEach((s, i) => {
      const ly = PAD_T + 6 + i * lineH;
      gx.fillStyle = s.colour;
      gx.globalAlpha = 0.85;
      gx.fillRect(legendX - gx.measureText(s.label).width - swatchSize - 5, ly - swatchSize / 2, swatchSize, swatchSize);
      gx.globalAlpha = 1;
      gx.fillStyle = '#4b5563';
      gx.fillText(s.label, legendX, ly);
    });
  }
}

// Seed-in-hand cursor (small green pip). Set reactively when selection changes.
const SEED_CURSOR = "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22'><ellipse cx='11' cy='11' rx='5' ry='7' fill='%23a7f3d0' stroke='%23166534' stroke-width='1.2'/></svg>\") 11 11, crosshair";

// Cached 24x24 species icons for the seed pouch.
const seedIconCache = new Map();
function getSeedIcon(sp) {
  if (seedIconCache.has(sp.id)) return seedIconCache.get(sp.id);
  const size = 24;
  const off = document.createElement('canvas');
  off.width = size; off.height = size;
  const ic = off.getContext('2d');
  // Fit the species' mature-ish silhouette inside 24x24.
  const approxH = Math.max(8, (sp.heightPx || 20) * 0.3);
  const scale = Math.min(1.0, 18 / approxH);
  ic.save();
  ic.translate(size/2, size - 3);
  ic.scale(scale, scale);
  try { sp.draw(ic, 0, 0, 0.3, 0, 0, 1); } catch(e) {}
  ic.restore();
  seedIconCache.set(sp.id, off);
  return off;
}

function roundRect(ctx, x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
  ctx.fill();
}

function findClickTarget(cx, cy) {
  let best = null, bestDist = 48;
  // E2 — old graves are clickable when player is within 200px.
  for (const g of graves) {
    if (g.sinkT < 2) continue; // only settled graves
    if (Math.abs(player.x - g.x) > 200) continue;
    const sx = g.x - camX;
    const gY = groundY(g.x);
    const dist = Math.hypot(cx - sx, cy - gY);
    if (dist < 24 && dist < bestDist) { bestDist = dist; best = { kind: 'grave', obj: g }; }
  }
  for (const p of plants.concat(fungi)) {
    const sp = SPECIES[p.speciesId];
    const sx = p.x - camX;
    const ph = sp.heightPx * Math.min(p.age / sp.matureAge, 1);
    const dist = Math.hypot(cx - sx, cy - (groundY(p.x) - ph * 0.5));
    if (dist < bestDist) { bestDist = dist; best = { kind: 'plant', obj: p }; }
  }
  for (const a of animals) {
    const sx = a.x - camX, sy = groundY(a.x) - 20;
    if (Math.hypot(cx - sx, cy - sy) < 32) {
      if (!best) best = { kind: 'animal', obj: a };
    }
  }
  return best;
}

canvas.addEventListener('click', e => {
  // If the click landed on an HTML overlay (info card, notes panel, etc.)
  // let the HTML element handle it; don't process canvas interaction.
  if (document.elementFromPoint(e.clientX, e.clientY) !== canvas) return;

  // E3 — memorial species choice (during death screen).
  for (const btn of memorialBtnBounds) {
    if (e.clientX >= btn.x && e.clientX <= btn.x + btn.w &&
        e.clientY >= btn.y && e.clientY <= btn.y + btn.h) {
      const lastGrave = graves[graves.length - 1];
      if (lastGrave) lastGrave.memorial = btn.species;
      return;
    }
  }
  // Speed/pause buttons (always immediate; also deselect any held seed).
  for (const btn of uiBtnBounds) {
    if (e.clientX >= btn.x && e.clientX <= btn.x + btn.w &&
        e.clientY >= btn.y && e.clientY <= btn.y + btn.h) {
      if (btn.action === 'pause') {
        paused = !paused;
      } else if (btn.action === 'speed') {
        speedIdx = btn.idx;
        speed = SPEEDS[speedIdx];
        paused = false;
      } else if (btn.action === 'mycelium') {
        mycelialView = !mycelialView; if (mycelialView) noteMycelialView();
      } else if (btn.action === 'notebook') {
        toggleNotebook();
      } else if (btn.action === 'graph') {
        toggleGraph();
      } else if (btn.action === 'shade') {
        SHADE_EFFECT = !SHADE_EFFECT;
      }
      if (player.selectedSeed) player.selectedSeed = null;
      return;
    }
  }
  // Seed pouch — click an icon to select/deselect that seed for sowing.
  for (const btn of pouchBtnBounds) {
    if (e.clientX >= btn.x && e.clientX <= btn.x + btn.w &&
        e.clientY >= btn.y && e.clientY <= btn.y + btn.h) {
      player.selectedSeed = (player.selectedSeed === btn.seedId) ? null : btn.seedId;
      return;
    }
  }

  // Seed-in-hand flow takes precedence: click empty ground to sow, click plant to cancel.
  if (player.selectedSeed) {
    const target = findClickTarget(e.clientX, e.clientY);
    // Animals cancel the sow; plants and empty ground both allow it.
    if (target && target.kind === 'animal') {
      player.selectedSeed = null;
      if (infoOpen) hideInfoCard();
      return;
    }
    const sp = SPECIES[player.selectedSeed];
    const wx = e.clientX + camX;
    sow(sp, wx, e.clientX, e.clientY);
    if (infoOpen) hideInfoCard();
    return;
  }

  // Click-away closes info card
  if (infoOpen) { hideInfoCard(); return; }

  const target = findClickTarget(e.clientX, e.clientY);
  if (!target) return;

  if (target.kind === 'plant') {
    showInfoCard(SPECIES[target.obj.speciesId], target.obj);
  } else if (target.kind === 'grave') {
    showGraveCard(target.obj);
  } else {
    const t = target.obj;
    showInfoCard({
      name: t.type.charAt(0).toUpperCase() + t.type.slice(1),
      latin: '—',
      info: animalInfo[t.type] || 'A wild creature.',
      edible: null,
    }, null);
  }
});
