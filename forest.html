<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Succession — Sci Wolf</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #f1f5f9;
  }
  canvas { display: block; }

  /* Home button */
  #home-btn {
    position: fixed; top: 12px; left: 12px; z-index: 100;
    width: 36px; height: 36px;
    background: #1e293b; border: 1px solid #334155;
    border-radius: 9px; display: flex; align-items: center;
    justify-content: center; text-decoration: none;
    font-size: 1.1rem; color: #94a3b8;
    transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  #home-btn:hover {
    color: #38bdf8; border-color: #38bdf8;
    box-shadow: 0 0 10px rgba(56,189,248,0.25);
  }

  /* Info card overlay */
  #info-card {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #1e293b; border: 1px solid #334155;
    border-radius: 14px; padding: 24px 28px;
    max-width: 340px; width: 90%;
    z-index: 200; display: none;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  #info-card.visible { display: block; }
  #info-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 2px; }
  #info-latin { font-size: 0.82rem; color: #94a3b8; font-style: italic; margin-bottom: 10px; }
  #info-desc { font-size: 0.85rem; color: #cbd5e1; line-height: 1.55; margin-bottom: 10px; }
  #info-edible {
    font-size: 0.83rem; padding: 8px 12px;
    border-radius: 8px; line-height: 1.5;
  }
  #info-edible.good { background: rgba(34,197,94,0.12); color: #4ade80; }
  #info-edible.bad  { background: rgba(239,68,68,0.12);  color: #f87171; }
  #info-persistence {
    display: none; margin-top: 10px;
    font-size: 0.78rem; color: #94a3b8; line-height: 1.5;
  }
  #info-persistence .plabel { margin-bottom: 3px; }
  #info-persistence .pill {
    display: inline-block; padding: 1px 8px;
    border-radius: 10px; font-size: 0.72rem;
    font-weight: 600; letter-spacing: 0.02em;
    margin-left: 2px;
  }
  #info-persistence .pill.sexual      { background: rgba(148,163,184,0.15); color: #cbd5e1; }
  #info-persistence .pill.clonal      { background: rgba(94,234,212,0.15);  color: #5eead4; }
  #info-persistence .pill.symbiotic   { background: rgba(251,191,36,0.15);  color: #fbbf24; }
  #info-persistence .pill.spore       { background: rgba(196,181,253,0.15); color: #c4b5fd; }
  #info-persistence .pill.dioecious   { background: rgba(251,113,133,0.15); color: #fb7185; }
  #info-persistence .pill.opportunist { background: rgba(148,163,184,0.15); color: #cbd5e1; }
  #info-persistence .pill.ancient     { background: rgba(200,180,160,0.15); color: #d6c7b5; }
  #info-harvest, #info-listen {
    display: none; margin-top: 10px; width: 100%;
    padding: 9px 0; border-radius: 8px;
    font-size: 0.88rem; font-weight: 600; cursor: pointer;
    transition: opacity 0.15s;
  }
  #info-listen {
    background: rgba(148,163,184,0.08); border: 1px solid rgba(148,163,184,0.30); color: #cbd5e1;
    font-weight: 500; font-style: italic;
  }
  #info-harvest:hover, #info-listen:hover { opacity: 0.8; }
  #info-harvest.good    { background: rgba(34,197,94,0.15);   border: 1px solid rgba(34,197,94,0.35);   color: #4ade80; }
  #info-harvest.bad     { background: rgba(239,68,68,0.15);   border: 1px solid rgba(239,68,68,0.35);   color: #f87171; }
  #info-harvest.neutral { background: rgba(100,116,139,0.15); border: 1px solid rgba(100,116,139,0.35); color: #94a3b8; }
  #info-cutdown, #info-tend, #info-harvest-money {
    display: none; margin-top: 6px; width: 100%;
    padding: 9px 0; border-radius: 8px;
    font-size: 0.88rem; font-weight: 600; cursor: pointer;
    transition: opacity 0.15s;
    background: rgba(100,116,139,0.15); border: 1px solid rgba(100,116,139,0.35); color: #94a3b8;
  }
  #info-tend {
    background: rgba(94,234,212,0.10); border-color: rgba(94,234,212,0.35); color: #5eead4;
  }
  #info-harvest-money {
    background: rgba(251,191,36,0.10); border-color: rgba(251,191,36,0.35); color: #fbbf24;
  }
  #info-cutdown:hover, #info-tend:hover, #info-harvest-money:hover { opacity: 0.8; }
  #info-close-hint {
    margin-top: 12px; font-size: 0.72rem;
    color: #475569; text-align: center;
  }

  /* D3 — end-of-age reflection overlay */
  #reflect-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 300;
    background: rgba(6,6,12,0);
    transition: background 1.6s ease;
    justify-content: center; align-items: center;
    flex-direction: column;
  }
  #reflect-overlay.visible {
    display: flex;
    background: rgba(6,6,12,0.92);
  }
  #reflect-overlay .reflect-body {
    max-width: 460px; width: 90%;
    text-align: center;
    opacity: 0;
    transition: opacity 1.8s ease 0.8s;
  }
  #reflect-overlay.visible .reflect-body { opacity: 1; }
  #reflect-overlay .reflect-summary {
    font: 300 1rem/1.75 Georgia, 'Times New Roman', serif;
    color: #cbd5e1;
    margin-bottom: 28px;
  }
  #reflect-overlay .reflect-question {
    font: italic 1.15rem/1.6 Georgia, 'Times New Roman', serif;
    color: #f1f5f9;
    margin-bottom: 16px;
  }
  #reflect-overlay .reflect-dismiss {
    font: 0.78rem/1.5 'Segoe UI', system-ui, sans-serif;
    color: #475569;
    margin-bottom: 28px;
  }
  #reflect-overlay .reflect-continue {
    display: inline-block;
    background: none;
    border: 1px solid #334155;
    border-radius: 4px;
    padding: 8px 22px;
    font: 0.82rem/1 'Segoe UI', system-ui, sans-serif;
    color: #94a3b8;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  #reflect-overlay .reflect-continue:hover {
    border-color: #64748b;
    color: #e2e8f0;
  }

  /* ── Field Notes panel ───────────────────────────────────────────────────── */
  #notes-panel {
    position: fixed; top: 0; right: -420px; width: 400px; height: 100vh;
    background: #111827; border-left: 1px solid #1e293b;
    display: flex; flex-direction: column;
    transition: right 0.32s cubic-bezier(.4,0,.2,1);
    z-index: 200; font-family: 'Georgia', serif;
  }
  #notes-panel.open { right: 0; }
  #notes-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 12px; border-bottom: 1px solid #1e293b;
    flex-shrink: 0;
  }
  #notes-title {
    font-size: 0.80rem; font-family: 'Segoe UI', system-ui, sans-serif;
    font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: #64748b;
  }
  #notes-close {
    background: none; border: none; color: #475569; cursor: pointer;
    font-size: 1.1rem; line-height: 1; padding: 2px 4px;
  }
  #notes-close:hover { color: #94a3b8; }
  #notes-list {
    flex: 1; overflow-y: auto; padding: 12px 16px 24px;
    display: flex; flex-direction: column; gap: 20px;
  }
  #notes-empty {
    color: #374151; font-size: 0.82rem; font-style: italic;
    text-align: center; padding: 60px 16px 0; line-height: 1.8;
    flex-shrink: 0;
  }
  .note-entry {
    border-top: 1px solid #1e293b; padding-top: 14px;
  }
  .note-entry:first-child { border-top: none; padding-top: 0; }
  .note-stamp {
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase;
    color: #374151; margin-bottom: 6px;
  }
  .note-observation {
    font-size: 0.78rem; color: #4b5563; line-height: 1.55;
    margin-bottom: 8px; font-style: italic;
  }
  .note-prompt {
    font-size: 0.82rem; color: #94a3b8; line-height: 1.55; margin-bottom: 6px;
  }
  .note-response {
    width: 100%; background: #0f172a; border: 1px solid #1e293b;
    color: #e2e8f0; font-family: 'Georgia', serif; font-size: 0.82rem;
    line-height: 1.55; padding: 7px 9px; resize: vertical;
    min-height: 64px; border-radius: 4px; outline: none;
    transition: border-color 0.15s;
  }
  .note-response:focus { border-color: #334155; }
  .note-response::placeholder { color: #374151; font-style: italic; }
  #notes-footer {
    flex-shrink: 0; padding: 12px 16px;
    border-top: 1px solid #1e293b;
  }
  #notes-close-bottom {
    width: 100%; padding: 9px 0;
    background: none; border: 1px solid #1e293b;
    border-radius: 6px; color: #475569;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 0.80rem; cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  #notes-close-bottom:hover { border-color: #334155; color: #94a3b8; }

  /* ── Population graph panel ──────────────────────────────────────────────── */
  #graph-panel {
    position: fixed; top: -280px; left: 0; width: 100%; height: 260px;
    background: #0a0f1a; border-bottom: 1px solid #1e293b;
    display: flex; flex-direction: column;
    overflow: hidden;
    transition: top 0.32s cubic-bezier(.4,0,.2,1);
    z-index: 200;
  }
  #graph-panel.open { top: 0; }
  #graph-header {
    display: flex; align-items: center; gap: 6px;
    padding: 9px 14px 8px; border-bottom: 1px solid #1e293b;
    flex-shrink: 0;
  }
  #graph-title {
    font-size: 0.78rem; font-family: 'Segoe UI', system-ui, sans-serif;
    font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: #374151; margin-right: auto;
  }
  .graph-tab {
    background: none; border: 1px solid transparent;
    border-radius: 5px; padding: 3px 9px;
    font-size: 0.70rem; font-family: 'Segoe UI', system-ui, sans-serif;
    letter-spacing: 0.03em; text-transform: uppercase;
    color: #374151; cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .graph-tab:hover { color: #64748b; }
  .graph-tab.active { color: #94a3b8; border-color: #334155; }
  #graph-close {
    background: none; border: none; color: #374151; cursor: pointer;
    font-size: 1rem; line-height: 1; padding: 2px 5px; margin-left: 4px;
  }
  #graph-close:hover { color: #64748b; }
  #graph-body { flex: 1; position: relative; overflow: hidden; min-height: 0; }
  #graph-canvas { position: absolute; inset: 0; }
</style>
</head>
<body>
<a href="index.html" id="home-btn">⌂</a>

<div id="graph-panel">
  <div id="graph-header">
    <span id="graph-title">Population Record</span>
    <button class="graph-tab active" data-layer="all">All</button>
    <button class="graph-tab" data-layer="canopy">Canopy</button>
    <button class="graph-tab" data-layer="shrub">Shrub</button>
    <button class="graph-tab" data-layer="ground">Ground</button>
    <button class="graph-tab" data-layer="fungal">Fungal</button>
    <button id="graph-close">✕</button>
  </div>
  <div id="graph-body"><canvas id="graph-canvas"></canvas></div>
</div>

<div id="notes-panel">
  <div id="notes-header">
    <span id="notes-title">Field Notes</span>
    <button id="notes-close">✕</button>
  </div>
  <div id="notes-empty">No observations yet.<br>The notebook fills as you explore.</div>
  <div id="notes-list"></div>
  <div id="notes-footer">
    <button id="notes-close-bottom">Close notebook</button>
  </div>
</div>

<canvas id="c"></canvas>

<div id="info-card">
  <div id="info-name"></div>
  <div id="info-latin"></div>
  <div id="info-desc"></div>
  <div id="info-edible"></div>
  <div id="info-persistence">
    <div class="plabel">Persistence &middot; <span class="pill"></span></div>
    <div class="pnote"></div>
  </div>
  <button id="info-listen">Listen</button>
  <button id="info-harvest"></button>
  <button id="info-harvest-money">Harvest</button>
  <button id="info-cutdown"></button>
  <button id="info-tend">Tend</button>
  <div id="info-close-hint">click outside to close</div>
</div>

<div id="reflect-overlay">
  <div class="reflect-body">
    <div class="reflect-summary"></div>
    <div class="reflect-question"></div>
    <div class="reflect-dismiss"></div>
    <button class="reflect-continue">continue living</button>
  </div>
</div>

<script>
'use strict';

// ── Canvas setup ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', () => { resize(); WORLD_W = canvas.width; initChunks(); _lastGraphLogLen = -1; if (_graphOpen) requestAnimationFrame(drawGraph); });

let WORLD_W = canvas.width;

// ── Time scale — classroom-tuneable ──────────────────────────────────────────
const YEARS_TO_CLIMAX  = 150;
const REAL_MINUTES     = 20;   // change this to adjust how fast the forest matures
const YEARS_PER_SECOND = YEARS_TO_CLIMAX / (REAL_MINUTES * 60);

// Deterministic pseudo-random — stable per plant+element, no flicker
function prand(seed, idx) {
  let s = ((seed * 1664525 + idx * 22695477 + 1013904223) | 0) >>> 0;
  s ^= s >>> 16; s = (Math.imul(s, 0x45d9f3b) | 0) >>> 0; s ^= s >>> 16;
  return s / 0xFFFFFFFF;
}

// ── Time ─────────────────────────────────────────────────────────────────────
let year    = 0;
let paused  = false;
const SPEEDS = [YEARS_PER_SECOND, YEARS_PER_SECOND * 16, YEARS_PER_SECOND * 64];
let speedIdx = 0;
let speed = SPEEDS[speedIdx];

// ── Camera ───────────────────────────────────────────────────────────────────
let camX = 0;

// ── Mycelial View ────────────────────────────────────────────────────────────
// Toggle with `m` or the moon button. `mycelialT` eases 0..1 over ~0.8 s so
// the transition reads as sinking into the soil, not a hard switch.
let mycelialView = false;
let mycelialT    = 0;
let myceliumEdges = [];
let _myceliumRecomputeTimer = 0;
const mycParticles   = [];   // flowing nutrient particles along network edges
let   _mycSpawnAccum = 0;

// ── Field Notes ───────────────────────────────────────────────────────────────
// Structured log — future-proof for print/export. Each entry is a plain object
// so it can be serialised to JSON with no extra work.
//   { id, trigger, year, seasonName, observation, prompt, response }
const fieldNotes = [];
let _notesNextId  = 1;
let _notebookOpen = false;
let _notebookPulse = 0;   // 0..1, drives the glow; decays to 0 over ~3 s
let _graphOpen = false;
let _graphLayer = 'all';
let _lastGraphLogLen = -1;
const _seenSpecies   = new Set(); // speciesIds that have appeared in the world (for era-change notes)
const _clickedSpecies = new Set(); // speciesIds the player has opened the info card for
let _prevEraLabel  = null;        // tracks succession era for era-change trigger
// Per-era throttles — each trigger fires at most once per succession era.
const _notedSpeciesEras = new Set();
const _notedEatEras     = new Set();
const _notedListenEras  = new Set();

const SEASON_NAMES = ['Spring','Summer','Autumn','Winter'];
function _currentSeason() { return SEASON_NAMES[Math.floor((year % 1) * 4)]; }
function _coverToEraLabel() {
  return successionEraLabel(averageSuccession());
}

function addFieldNote(trigger, observation, prompt) {
  const entry = {
    id:          _notesNextId++,
    trigger,
    year:        Math.floor(year),
    seasonName:  _currentSeason(),
    observation, // string — auto-filled ecological facts
    prompt,      // string — the question the student should answer
    response:    '',
  };
  fieldNotes.unshift(entry); // newest first
  _notebookPulse = 1;
  _renderNotes();
}

function _renderNotes() {
  const list  = document.getElementById('notes-list');
  const empty = document.getElementById('notes-empty');
  // notes-empty is a sibling of notes-list (not a child), so innerHTML = ''
  // on the list will never destroy it.
  const hasNotes = fieldNotes.length > 0;
  if (empty) empty.style.display = hasNotes ? 'none' : '';
  if (!hasNotes) { list.innerHTML = ''; return; }

  list.innerHTML = '';
  for (const e of fieldNotes) {
    const div = document.createElement('div');
    div.className = 'note-entry';
    div.dataset.id = e.id;
    div.innerHTML = `
      <div class="note-stamp">Year ${e.year} &middot; ${e.seasonName} &middot; ${e.trigger}</div>
      <div class="note-observation">${e.observation}</div>
      <div class="note-prompt">${e.prompt}</div>
      <textarea class="note-response" placeholder="Write your observation here…" rows="3">${e.response}</textarea>
    `;
    div.querySelector('textarea').addEventListener('input', ev => {
      e.response = ev.target.value;
    });
    list.appendChild(div);
  }
}

function toggleNotebook() {
  _notebookOpen = !_notebookOpen;
  document.getElementById('notes-panel').classList.toggle('open', _notebookOpen);
  if (_notebookOpen) {
    _notebookPulse = 0;
    // If no game-triggered note is pending (pulse was 0 before opening),
    // add a blank open-observation entry so the student has somewhere to write.
    const topNote = fieldNotes[0];
    const topIsBlank = topNote && topNote.response.trim() === '';
    if (!topIsBlank) {
      const succPct = Math.round(averageSuccession() * 100);
      addFieldNote(
        'Observation',
        `Year ${Math.floor(year)} · ${_currentSeason()} · succession ${succPct}%.`,
        'Write down one thing you notice about the forest right now.'
      );
    }
    _notebookPulse = 0; // opening clears the alert even if addFieldNote re-armed it
  }
}

document.getElementById('notes-close').addEventListener('click', toggleNotebook);
document.getElementById('notes-close-bottom').addEventListener('click', toggleNotebook);

function toggleGraph() {
  _graphOpen = !_graphOpen;
  document.getElementById('graph-panel').classList.toggle('open', _graphOpen);
  if (_graphOpen) { _lastGraphLogLen = -1; requestAnimationFrame(drawGraph); }
}

document.getElementById('graph-close').addEventListener('click', toggleGraph);
document.getElementById('graph-header').addEventListener('click', e => {
  const tab = e.target.closest('.graph-tab');
  if (!tab) return;
  _graphLayer = tab.dataset.layer;
  document.querySelectorAll('.graph-tab').forEach(t => t.classList.toggle('active', t === tab));
  _lastGraphLogLen = -1;
  drawGraph();
});

// Debug pane — toggle with ` (backtick)
let showDebug = false;

// C4 — player-as-node trail. Each entry ages out over ~0.7 s.
let playerTrail = [];
let _trailSampleTimer = 0;
const TRAIL_LIFE = 0.7;

// C5 — contextual text shown once per entry into mycelial view.
const myceliumLines = [
  "What you called a forest is also this.",
  "Beneath every step, a city.",
  "There is no above and below. There is only here.",
  "The trees are talking. You are walking through the conversation.",
  "You walked over me. I felt nothing, and everything.",
  "What looks like many is one body, slowly.",
];
let _mycelialLineIdx  = 0;
let mycelialLineText  = '';
let mycelialLineT     = 0;     // seconds remaining in the 6 s fade cycle
const MYCELIAL_LINE_DURATION = 6.0;
let _prevMycelialView = false;

// ── Ground ───────────────────────────────────────────────────────────────────
function groundY(x) {
  return canvas.height * 0.72
    + Math.sin(x * 0.0018) * 22
    + Math.sin(x * 0.0041) * 11
    + Math.sin(x * 0.00097) * 35;
}

// ── Species Definitions ──────────────────────────────────────────────────────
const SPECIES = {};

function defSpecies(id, data) { SPECIES[id] = { id, ...data }; }

// Helper draw functions
function drawCircle(ctx, x, y, r, color) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = color; ctx.fill();
}

// ── PIONEERS ─────────────────────────────────────────────────────────────────

defSpecies('lichen', {
  name: 'Crustose Lichen', latin: 'Xanthoria parietina',
  kingdom: 'fungi+algae', layer: 'ground',
  era: 'pioneer', coverMin: 0, coverMax: 0.10,
  frequency: 0.45,
  maxAge: 80, matureAge: 3, heightPx: 4,
  spreadPerYear: 1.2, spreadRadius: 60,
  edible: null,
  info: "One of the first colonists of bare rock and soil. Lichens are a partnership between fungi and algae, slowly breaking down rock into soil.",
  draw(ctx, x, gy, t, season, phase) {
    const s = 6 + t * 14;
    const colors = ['#c9a227','#9ab05a','#7d9b45','#d4b03a'];
    for (let i = 0; i < 5; i++) {
      const ox = Math.sin(i * 2.1) * s * 0.8;
      const oy = Math.cos(i * 1.7) * s * 0.3;
      const r  = (3 + Math.sin(i) * 2) * t;
      ctx.beginPath();
      ctx.ellipse(x + ox, gy + oy, r * 1.6, r * 0.9, i * 0.5, 0, Math.PI*2);
      ctx.fillStyle = colors[i % colors.length];
      ctx.globalAlpha = 0.85; ctx.fill(); ctx.globalAlpha = 1;
    }
  }
});

defSpecies('moss', {
  name: 'Cushion Moss', latin: 'Polytrichum commune',
  kingdom: 'plant', layer: 'ground',
  era: 'pioneer', coverMin: 0, coverMax: 0.15,
  frequency: 0.30,
  maxAge: 40, matureAge: 2, heightPx: 8,
  spreadPerYear: 1.0, spreadRadius: 50,
  edible: null,
  info: "Mosses hold moisture and create the first thin organic layer — the very beginning of soil. Hundreds of invertebrates shelter here.",
  draw(ctx, x, gy, t, season, phase, id) {
    const w = (8 + t * 18);
    const h = (3 + t * 8);
    const green = season === 3 ? '#4a6741' : '#4a7c3f';
    ctx.beginPath();
    ctx.ellipse(x, gy - h * 0.5, w, h, 0, Math.PI, Math.PI*2);
    ctx.fillStyle = green; ctx.fill();
    // bristle textures
    for (let i = -3; i <= 3; i++) {
      ctx.beginPath();

  info: "Eastern hemlock is the patience of the forest. It can wait two hundred years in shade, barely growing, then fill a canopy gap. A single tree may live eight centuries. Its dense shade creates a cool, dark world beneath — a microclimate for salamanders and ferns.",
