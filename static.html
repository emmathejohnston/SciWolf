<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static Electricity</title>
  <style>
    :root {
      --bg:      #0f172a;
      --surface: #1e293b;
      --surface2: #334155;
      --border:  #334155;
      --muted:   #475569;
      --text:    #f1f5f9;
      --sub:     #94a3b8;
      --accent:  #38bdf8;
      --canvas-bg:   #0f172a;
      --canvas-grid: rgba(51,65,85,0.3);
    }
    html.light {
      --bg:      #f1f5f9;
      --surface: #ffffff;
      --surface2: #e2e8f0;
      --border:  #cbd5e1;
      --muted:   #94a3b8;
      --text:    #0f172a;
      --sub:     #475569;
      --accent:  #0284c7;
      --canvas-bg:   #f1f5f9;
      --canvas-grid: rgba(148,163,184,0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      user-select: none;
    }
    .home-btn {
      position: fixed;
      top: 12px; left: 12px;
      z-index: 999;
      width: 36px; height: 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
      font-size: 1.1rem;
      color: var(--sub);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .home-btn:hover { background: var(--surface2); border-color: var(--accent); color: var(--text); }
    #c { display: block; cursor: grab; }
    #c.dragging { cursor: grabbing; }

    #theme-toggle {
      position: fixed; top: 12px; right: 12px; z-index: 999;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 12px;
      font-size: 0.8rem; color: var(--sub); cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    #theme-toggle:hover { border-color: var(--accent); color: var(--text); }
    .apparatus-toggle {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      gap: 4px;
      padding: 4px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid var(--border);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.18);
    }
    html.light .apparatus-toggle {
      background: rgba(255, 255, 255, 0.9);
    }
    .apparatus-btn {
      border: 0;
      border-radius: 9px;
      padding: 9px 14px;
      background: transparent;
      color: var(--sub);
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, transform 0.15s;
      min-width: 110px;
      min-height: 40px;
      touch-action: manipulation;
    }
    .apparatus-btn:hover {
      color: var(--text);
      background: var(--surface2);
    }
    .apparatus-btn.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 6px 14px rgba(2, 132, 199, 0.25);
    }
    .apparatus-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    #toolbar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 86px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 5px;
      overflow-x: auto;
    }
    .pitem {
      flex-shrink: 0;
      width: 72px;
      height: 72px;
      background: var(--surface2);
      border: 2px solid var(--muted);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      font-size: 0.6rem;
      color: var(--sub);
      text-align: center;
      transition: background 0.12s, border-color 0.12s;
    }
    .pitem:hover { background: var(--muted); border-color: var(--accent); color: var(--text); }
    .pitem .icon { font-size: 1.55rem; line-height: 1.2; }
    .pitem img.blend-multiply { mix-blend-mode: multiply; }
    .hint {
      position: fixed;
      top: 62px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 14px;
      font-size: 0.76rem;
      color: var(--sub);
      pointer-events: none;
      white-space: nowrap;
      opacity: 0.9;
    }
    @media (max-width: 720px) {
      .apparatus-toggle {
        top: 56px;
        width: min(calc(100vw - 24px), 360px);
      }
      .apparatus-btn {
        flex: 1;
        min-width: 0;
        padding: 11px 10px;
        font-size: 0.78rem;
      }
      .hint {
        top: 108px;
        width: min(calc(100vw - 24px), 420px);
        white-space: normal;
        text-align: center;
        line-height: 1.35;
      }
    }
  </style>
  <script>if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light');</script>

<body>
<a href="index.html" class="home-btn" title="Home">⌂</a>
<button id="theme-toggle">☀️ Light</button>
<div class="apparatus-toggle" role="tablist" aria-label="Choose apparatus">
  <button id="show-electroscope" class="apparatus-btn active" type="button" role="tab" aria-selected="true">Electroscope</button>
  <button id="show-pith" class="apparatus-btn" type="button" role="tab" aria-selected="false">Pith Ball</button>
</div>
<canvas id="c"></canvas>
<div id="toolbar"></div>
<div class="hint">Click palette to add · Drag to rub · Double-click to remove</div>

<script>
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const BAR_H   = 86;

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight - BAR_H;
}
window.addEventListener('resize', () => { resize(); });
resize();

// ═══════════════════════════════════════════════════════
// Triboelectric series — higher = more positive tendency
// rod:true → drawn as elongated capsule
// ═══════════════════════════════════════════════════════
const TYPES = {
  rabbitfur: { label:'Rabbit Fur',  emoji:'🐇', imgSrc:'assets/Rabbit Fur.png',  series: 9,  r:28, baseE:14, color:'#c4a46b', spriteH:106 },
  wool:      { label:'Wool',        emoji:'🧶',  imgSrc:'assets/Wool.png',         series: 7,  r:28, baseE:14, color:'#a78bfa' },
  glassfrod: { label:'Glass Rod',   emoji:'🔵', imgSrc:'assets/Glass Test Tube.png', series: 6,  r:14, baseE: 8, color:'#93c5fd', rod:true, spriteH:106 },
  hair:      { label:'Hair',        emoji:'💇',  imgSrc:'assets/Human Hair.png',      series: 5,  r:26, baseE:12, color:'#fbbf24', spriteH:106 },
  silk:      { label:'Silk',        emoji:'🎀',  imgSrc:'assets/Silk.png',            series: 3,  r:24, baseE:12, color:'#f9a8d4', spriteH:106 },
  paper:     { label:'Paper',       emoji:'📄',  imgSrc:'assets/Paper.png',        series: 1,  r:22, baseE:10, color:'#e2e8f0', spriteH:106 },
  balloon:   { label:'Balloon',     emoji:'🎈',  imgSrc:'assets/Balloon.png',      series:-5,  r:30, baseE:14, color:'#f87171', spriteH:106 },
  ebonite:   { label:'Ebonite',     emoji:'⬛',  imgSrc:'assets/Ebonite Rod.png',  series:-7,  r:14, baseE: 8, color:'#0f172a', rod:true },
  plastic:   { label:'Plastic Bag', emoji:'🔴',  imgSrc:'assets/Plastic Bag.png',  series:-8,  r:24, baseE:10, color:'#dc2626', spriteH:106 },
};

// ═══════════════════════════════════════════════════════
// Preload object images
// ═══════════════════════════════════════════════════════
const IMGS = {};
for (const [key, t] of Object.entries(TYPES)) {
  if (t.imgSrc) {
    const img = new Image();
    img.src = t.imgSrc;
    IMGS[key] = img;
  }
}

// ═══════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════
let instances = [];
let sparks    = [];
let labels    = []; // transient "+e" flying label
let nextId    = 0;
let apparatusMode = 'electroscope';

// Charge glyph particles for electroscope
let scopeGlyphs = [];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function mkInst(typeKey, x, y) {
  const t = TYPES[typeKey];
  return {
    id: nextId++, type: typeKey,
    x, y, vx: 0, vy: 0,
    protons:   t.baseE,
    electrons: t.baseE,
    dragging: false,
    rubTimer: 0,
    rodAngle: -Math.PI / 5,  // rods start tilted
  };
}
const ch  = i => i.protons - i.electrons;
const rad = i => TYPES[i.type].r;
const maxE = i => TYPES[i.type].baseE * 2;

// ═══════════════════════════════════════════════════════
// Electroscope
// ═══════════════════════════════════════════════════════
const scope = {
  get x()      { return canvas.width - 124; },
  get rodTopY(){ return canvas.height - 176; },
  get pivotY() { return canvas.height - 86; },
  leafAngle: 0,
  leafTarget: 0,
  netCharge: 0,      // persistent charge from touching the knob
  headCharge: 0,
  leafCharge: 0,
  leafSign: 0,       // +1 / -1 for color
};

// ═══════════════════════════════════════════════════════
// Pith Ball (KAN-11)
// ═══════════════════════════════════════════════════════
const PITH_R      = 16;       // ball radius px
const PITH_L      = 72;       // thread length px
const PITH_MASS   = 1.0;
const PITH_DAMP   = 0.94;
const PITH_K_IND  = 2200;     // induction attraction constant
const PITH_K_COUL = 2200;     // coulomb constant for pith

const pith = {
  get standX()  { return canvas.width * 0.48; },
  get standTopY() { return 96; },
  get standBaseY() { return canvas.height - 42; },
  get armY()    { return 120; },
  get armLength() { return 84; },
  get anchorX() { return this.standX + this.armLength; },
  get anchorY() { return this.armY; },
  angle:    0,       // angle from vertical (radians), positive = right
  angleV:   0,       // angular velocity
  charge:   0,       // charge acquired by conduction
  touched:  false,   // has been touched this frame (to prevent re-touch)
};

function pithBallPos() {
  return {
    x: pith.anchorX + Math.sin(pith.angle) * PITH_L,
    y: pith.anchorY + Math.cos(pith.angle) * PITH_L,
  };
}

function updatePith() {
  const { x: bx, y: by } = pithBallPos();
  const ax = pith.anchorX;

  let netTorque = 0; // net lateral force (simplified as torque ~= lateral force * L)

  pith.touched = false;
  for (const inst of instances) {
    const q  = ch(inst);
    if (q === 0 && pith.charge === 0) continue;
    const dx = inst.x - bx;
    const dy = inst.y - by;
    const d  = Math.max(Math.hypot(dx, dy), PITH_R + rad(inst));

    // Check contact (conduction)
    if (d <= PITH_R + rad(inst) + 4 && !pith.touched) {
      pith.touched = true;
      if (q !== 0 && !inst._pithContact) {
        const delta = Math.sign(q);
        const nextE = inst.electrons + delta;
        if (nextE >= 2 && nextE <= maxE(inst)) {
          inst.electrons = nextE;
          pith.charge    = delta;
        }
        inst._pithContact = true;
      }
    } else {
      inst._pithContact = false;
    }

    let F = 0;

    if (pith.charge !== 0 && q !== 0) {
      // Coulomb: attraction pulls toward the object, repulsion pushes away from it
      const towardObject = Math.sign(dx);
      const interactionSign = pith.charge * q > 0 ? -1 : 1;
      F = interactionSign * towardObject * (PITH_K_COUL * Math.abs(pith.charge * q) / (d * d));
    } else if (pith.charge === 0 && q !== 0) {
      // Induction: always attractive
      F = Math.sign(dx) * (PITH_K_IND * Math.abs(q) / (d * d));
    } else if (pith.charge !== 0 && q === 0) {
      // Neutral objects polarize too, so a charged pith ball should still be attracted.
      F = Math.sign(dx) * (PITH_K_IND * Math.abs(pith.charge) / (d * d));
    }

    // Lateral force → angular acceleration
    // torque ≈ F_lateral / (PITH_MASS * PITH_L)
    // Only add if object is nearby enough
    if (d < 200) {
      netTorque += (F / (PITH_MASS * PITH_L)) * 0.04;
    }
  }

  // Gravity restoring torque: -(g/L)*sin(angle), simplified as -angle * k
  const gravity = 0.003;
  netTorque -= gravity * Math.sin(pith.angle);

  pith.angleV += netTorque;
  pith.angleV *= PITH_DAMP;
  pith.angle  += pith.angleV;

  // Clamp angle
  pith.angle = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pith.angle));
}

function drawPithBall() {
  const standX = pith.standX;
  const standTopY = pith.standTopY;
  const standBaseY = pith.standBaseY;
  const armY = pith.armY;
  const ax = pith.anchorX;
  const ay = pith.anchorY;
  const { x: bx, y: by } = pithBallPos();

  // Label
  ctx.font         = '11px Segoe UI, sans-serif';
  ctx.fillStyle    = '#475569';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText('Pith Ball', ax, standTopY - 10);

  // Retort stand base
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth   = 5;
  ctx.lineCap     = 'round';
  ctx.beginPath();
  ctx.moveTo(standX - 26, standBaseY);
  ctx.lineTo(standX + 30, standBaseY);
  ctx.stroke();

  // Vertical stand
  ctx.beginPath();
  ctx.moveTo(standX, standBaseY);
  ctx.lineTo(standX, standTopY);
  ctx.stroke();

  // Horizontal arm
  ctx.beginPath();
  ctx.moveTo(standX, armY);
  ctx.lineTo(ax, armY);
  ctx.stroke();

  // Clamp point
  ctx.beginPath();
  ctx.arc(ax, ay, 5, 0, Math.PI * 2);
  ctx.fillStyle = '#64748b';
  ctx.fill();

  // Thread
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth   = 1.5;
  ctx.lineCap     = 'round';
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.lineTo(bx, by);
  ctx.stroke();

  // Ball
  const hasCharge = pith.charge !== 0;
  const ballCol   = hasCharge
    ? (pith.charge > 0 ? '#fb923c' : '#818cf8')
    : '#cbd5e1';
  ctx.beginPath();
  ctx.arc(bx, by, PITH_R, 0, Math.PI * 2);
  ctx.fillStyle   = ballCol;
  ctx.fill();
  ctx.strokeStyle = hasCharge ? ballCol : '#64748b';
  ctx.lineWidth   = 1.5;
  ctx.stroke();

  // Charge sign on ball
  if (hasCharge) {
    const sign = pith.charge > 0 ? '+' : '−';
    ctx.font         = 'bold 10px sans-serif';
    ctx.fillStyle    = '#fff';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(sign, bx, by);
  }

  drawChargeMarkers({
    x: bx, y: by, radius: PITH_R - 1,
    protonCount: 4,
    electronCount: clamp(4 - pith.charge, 0, 8),
    rod: false,
  });
}

// ═══════════════════════════════════════════════════════
// Ground
// ═══════════════════════════════════════════════════════
const GX = 80;
const groundTopY = () => canvas.height - 120;
const groundBotY = () => canvas.height - 20;

// ═══════════════════════════════════════════════════════
// Sparks & labels
// ═══════════════════════════════════════════════════════
function addSparks(x, y, n = 5) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 2 + Math.random() * 4;
    sparks.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1 });
  }
}

function addLabel(x, y, text, col) {
  labels.push({ x, y, vy: -1.2, life: 1, text, col });
}

function tickParticles() {
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx; s.y += s.vy;
    s.vx *= 0.88; s.vy *= 0.88;
    s.life -= 0.055;
    if (s.life <= 0) sparks.splice(i, 1);
  }
  for (let i = labels.length - 1; i >= 0; i--) {
    const l = labels[i];
    l.y += l.vy;
    l.life -= 0.025;
    if (l.life <= 0) labels.splice(i, 1);
  }
}

function drawParticles() {
  for (const s of sparks) {
    ctx.beginPath();
    ctx.arc(s.x, s.y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(251,191,36,${s.life.toFixed(2)})`;
    ctx.fill();
  }
  for (const l of labels) {
    ctx.font = 'bold 12px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = `rgba(${l.col},${l.life.toFixed(2)})`;
    ctx.fillText(l.text, l.x, l.y);
  }
}

// ═══════════════════════════════════════════════════════
// Charge Glyph Particles (KAN-9 / KAN-10)
// ═══════════════════════════════════════════════════════
const GLYPH_MAX = 10;
const GLYPH_LIFETIME = 180; // frames

function spawnGlyph(cx, cy, radius, sign) {
  // Spawn at a random angle around the region
  const a = Math.random() * Math.PI * 2;
  const r = radius * (0.5 + Math.random() * 0.9);
  const speed = 0.18 + Math.random() * 0.22;
  const angleV = (Math.random() < 0.5 ? 1 : -1) * speed; // orbit direction
  return {
    angle: a,
    r,
    angleV,
    life: 1,
    decay: 1 / (GLYPH_LIFETIME * (0.7 + Math.random() * 0.6)),
    sign,
    // offset from center
    ox: (Math.random() - 0.5) * radius * 0.4,
    oy: (Math.random() - 0.5) * radius * 0.4,
  };
}

function tickGlyphs(arr, cx, cy, radius, sign, maxCount) {
  // Decay existing
  for (let i = arr.length - 1; i >= 0; i--) {
    const g = arr[i];
    g.angle += g.angleV;
    g.life  -= g.decay;
    if (g.life <= 0) arr.splice(i, 1);
  }
  // Spawn new if below max
  if (arr.length < maxCount) {
    arr.push(spawnGlyph(cx, cy, radius, sign));
  }
}

function drawGlyphs(arr, cx, cy) {
  ctx.save();
  ctx.font = 'bold 11px Segoe UI, sans-serif';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  for (const g of arr) {
    const x = cx + g.ox + Math.cos(g.angle) * g.r;
    const y = cy + g.oy + Math.sin(g.angle) * g.r;
    const alpha = Math.min(g.life, 0.85).toFixed(2);
    const col = g.sign > 0 ? `rgba(251,146,60,${alpha})` : `rgba(129,140,248,${alpha})`;
    ctx.fillStyle = col;
    ctx.fillText(g.sign > 0 ? '+' : '−', x, y);
  }
  ctx.restore();
}

function chargePoints(x, y, radius, count, phase = 0) {
  const pts = [];
  for (let i = 0; i < count; i++) {
    const a = phase + (i / Math.max(count, 1)) * Math.PI * 2;
    pts.push({ x: x + Math.cos(a) * radius, y: y + Math.sin(a) * radius });
  }
  return pts;
}

function rodChargePoints(x, y, halfW, halfH, count, inset = 8) {
  const pts = [];
  const cols = 2;
  const rows = Math.ceil(count / cols);
  for (let i = 0; i < count; i++) {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const px = x + (col === 0 ? -1 : 1) * Math.max(halfW - inset, 4);
    const py = y - halfH + inset + ((row + 0.5) / rows) * Math.max((halfH * 2) - inset * 2, 10);
    pts.push({ x: px, y: py });
  }
  return pts;
}

function drawSignedDot(x, y, sign, alpha = 1) {
  const isPositive = sign > 0;
  ctx.save();
  ctx.globalAlpha = alpha;
  if (isPositive) {
    ctx.strokeStyle = '#fb923c';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x - 3, y);
    ctx.lineTo(x + 3, y);
    ctx.moveTo(x, y - 3);
    ctx.lineTo(x, y + 3);
    ctx.stroke();
  } else {
    ctx.fillStyle = '#818cf8';
    ctx.beginPath();
    ctx.arc(x, y, 2.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(224,231,255,0.85)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(x - 2.4, y);
    ctx.lineTo(x + 2.4, y);
    ctx.stroke();
  }
  ctx.restore();
}

function drawChargeMarkers({ x, y, radius, protonCount, electronCount, rod = false, rodAngle = 0, halfW = 0, halfH = 0 }) {
  ctx.save();
  if (rod) {
    ctx.translate(x, y);
    ctx.rotate(rodAngle);
    const pPts = rodChargePoints(0, 0, halfW, halfH, protonCount, 10);
    const ePts = rodChargePoints(0, 0, Math.max(halfW - 1, 6), Math.max(halfH - 1, 8), electronCount, 10)
      .map((pt, i) => ({ x: pt.x + (i % 2 === 0 ? 4 : -4), y: pt.y }));
    pPts.forEach(pt => drawSignedDot(pt.x, pt.y, 1, 0.9));
    ePts.forEach(pt => drawSignedDot(pt.x, pt.y, -1, 0.95));
  } else {
    const markerR = Math.max(radius * 0.58, 8);
    const pPts = chargePoints(x, y, markerR, protonCount, Math.PI / Math.max(protonCount, 1));
    const ePts = chargePoints(x, y, markerR, electronCount, (Math.PI / Math.max(electronCount, 1)) + Math.PI / 2);
    pPts.forEach(pt => drawSignedDot(pt.x, pt.y, 1, 0.9));
    ePts.forEach(pt => drawSignedDot(pt.x, pt.y, -1, 0.95));
  }
  ctx.restore();
}

function setObjectCharge(inst, targetCharge) {
  const boundedCharge = clamp(targetCharge, inst.protons - maxE(inst), inst.protons - 2);
  inst.electrons = inst.protons - boundedCharge;
}

function splitContactCharge(objectCharge, scopeCharge) {
  const total = objectCharge + scopeCharge;
  const objectTarget = total >= 0 ? Math.ceil(total / 2) : Math.floor(total / 2);
  const scopeTarget = total - objectTarget;
  return { objectTarget, scopeTarget };
}

// ═══════════════════════════════════════════════════════
// Rubbing
// ═══════════════════════════════════════════════════════
const RUB_INTERVAL = 9; // frames between transfers

function handleRubbing(dragged) {
  for (const other of instances) {
    if (other === dragged || other.dragging) continue;
    const d = Math.hypot(dragged.x - other.x, dragged.y - other.y);
    if (d >= rad(dragged) + rad(other) - 8) {
      if (other !== dragged) other._rubbing = false;
      continue;
    }
    dragged.rubTimer++;
    const mx = (dragged.x + other.x) / 2;
    const my = (dragged.y + other.y) / 2;

    if (dragged.rubTimer % RUB_INTERVAL === 0) {
      addSparks(mx, my);
      const sa = TYPES[dragged.type].series;
      const sb = TYPES[other.type].series;
      if (sa > sb) {
        // dragged loses electron → other gains
        if (dragged.electrons > 2 && other.electrons < maxE(other)) {
          dragged.electrons--;
          other.electrons++;
          addLabel(mx, my - 12, '−e →', '129,140,248');
        }
      } else if (sb > sa) {
        // other loses electron → dragged gains
        if (other.electrons > 2 && dragged.electrons < maxE(dragged)) {
          other.electrons--;
          dragged.electrons++;
          addLabel(mx, my - 12, '← −e', '129,140,248');
        }
      }
    }
  }
}

// ═══════════════════════════════════════════════════════
// Grounding
// ═══════════════════════════════════════════════════════
function checkGround() {
  for (const inst of instances) {
    if (inst.dragging) continue;
    const d = Math.hypot(inst.x - GX, inst.y - (groundTopY() + 10));
    if (d < rad(inst) + 24) {
      if (inst.electrons < inst.protons) inst.electrons++;
      else if (inst.electrons > inst.protons) inst.electrons--;
      if (inst.electrons !== inst.protons && Math.random() < 0.3)
        addSparks(GX + (Math.random() - 0.5) * 10, groundTopY() + 10);
    }
  }
}

// ═══════════════════════════════════════════════════════
// Electroscope update
// ═══════════════════════════════════════════════════════
function updateScope() {
  const sx = scope.x, ky = scope.rodTopY;
  let nearestQ = 0, nearestDist = Infinity;
  for (const inst of instances) {
    const q = ch(inst);
    const d = Math.hypot(inst.x - sx, inst.y - ky);
    if (q !== 0 && d < nearestDist) {
      nearestQ = q;
      nearestDist = d;
    }
    if (q !== 0 && d < rad(inst) + 13) {
      if (!inst._scopeTouch) {
        const { objectTarget, scopeTarget } = splitContactCharge(q, scope.netCharge);
        setObjectCharge(inst, objectTarget);
        scope.netCharge = clamp(scopeTarget, -8, 8);
        addLabel(sx, ky - 26, 'charge split', '129,140,248');
        inst._scopeTouch = true;
      }
    } else {
      inst._scopeTouch = false;
    }
  }

  let induction = 0;
  if (nearestQ !== 0 && nearestDist < 220) {
    induction = clamp(Math.round((Math.abs(nearestQ) * 240) / Math.max(nearestDist, 42)), 0, 4);
  }

  const headInduction = nearestQ === 0 ? 0 : -Math.sign(nearestQ) * induction;
  const leafInduction = nearestQ === 0 ? 0 :  Math.sign(nearestQ) * induction;

  scope.headCharge = headInduction + Math.trunc(scope.netCharge * 0.35);
  scope.leafCharge = leafInduction + scope.netCharge;
  const spreadStrength = Math.max(Math.abs(scope.leafCharge), Math.abs(scope.netCharge));
  scope.leafTarget = Math.min(spreadStrength * 0.09, 0.65);
  scope.leafSign   = Math.sign(scope.leafCharge || scope.netCharge || nearestQ);

  // Smooth animation
  scope.leafAngle += (scope.leafTarget - scope.leafAngle) * 0.1;
}

function electroscopeElectronCount(base, charge) {
  return clamp(base - charge, 0, base + 4);
}

function drawElectroscopeCharges(sx, ky, pivotY, leafL, ang) {
  drawChargeMarkers({
    x: sx,
    y: ky - 13,
    radius: 13,
    protonCount: 5,
    electronCount: electroscopeElectronCount(5, scope.headCharge),
    rod: false,
  });

  const shaftStations = 5;
  for (let i = 0; i < shaftStations; i++) {
    const t = (i + 1) / (shaftStations + 1);
    const y = (ky - 13) + (pivotY - (ky - 13)) * t;
    const localCharge = Math.round(scope.headCharge * (1 - t) + scope.leafCharge * t);
    drawChargeMarkers({
      x: sx,
      y,
      radius: 8,
      protonCount: 2,
      electronCount: electroscopeElectronCount(2, localCharge),
      rod: false,
    });
  }

  const leftTip  = { x: sx - leafL * Math.sin(ang) * 0.72, y: pivotY + leafL * Math.cos(ang) * 0.72 };
  const rightTip = { x: sx + leafL * Math.sin(ang) * 0.72, y: pivotY + leafL * Math.cos(ang) * 0.72 };
  const leafElectronCount = electroscopeElectronCount(4, scope.leafCharge);

  drawChargeMarkers({ x: leftTip.x, y: leftTip.y, radius: 13, protonCount: 4, electronCount: leafElectronCount, rod: false });
  drawChargeMarkers({ x: rightTip.x, y: rightTip.y, radius: 13, protonCount: 4, electronCount: leafElectronCount, rod: false });
}

// ═══════════════════════════════════════════════════════
// Physics (Coulomb + collision + sticking + boundaries)
// ═══════════════════════════════════════════════════════
const SPRITE_H = 53; // px — all sprites scaled to this height (wool reference)
const K_C   = 1000;
const K_IND = 80;   // induction: neutral attracted to any charged object
const DAMP  = 0.88;
const PAD  = 55;

// Opposite-charged objects only attract within this distance
const attractCutoff = () => Math.min(canvas.width, canvas.height) * 0.5;

function updatePhysics() {
  const free = instances.filter(i => !i.dragging);

  for (let i = 0; i < free.length; i++) {
    for (let j = i + 1; j < free.length; j++) {
      const a = free[i], b = free[j];
      const qa = ch(a), qb = ch(b);
      const dx = b.x - a.x, dy = b.y - a.y;
      const dRaw = Math.hypot(dx, dy);
      const minD = rad(a) + rad(b);

      // ── Solid collision / sticking ──────────────────
      const overlap = minD - dRaw;
      if (overlap >= 0.5) {
        const d  = Math.max(dRaw, 0.1);
        const nx = dx / d, ny = dy / d;
        // Push back to exactly 0.5px overlap (not fully separated, avoids over-push jitter)
        const push = (overlap - 0.5) * 0.5;
        a.x -= nx * push; a.y -= ny * push;
        b.x += nx * push; b.y += ny * push;

        if (qa * qb < 0) {
          // Opposite charges → stick: zero velocity to prevent contact oscillation
          a.vx = 0; a.vy = 0;
          b.vx = 0; b.vy = 0;
        } else {
          // Like charges or neutral → elastic-ish bounce
          const approach = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (approach < 0) {
            a.vx += approach * nx * 0.55; a.vy += approach * ny * 0.55;
            b.vx -= approach * nx * 0.55; b.vy -= approach * ny * 0.55;
          }
        }
        continue; // skip force calculation; objects are in contact
      }

      if (qa === 0 && qb === 0) continue;

      // ── Neutral-charged induction attraction ────────
      if (qa === 0 || qb === 0) {
        const q  = qa !== 0 ? Math.abs(qa) : Math.abs(qb);
        const d2 = Math.max(dRaw * dRaw, minD * minD);
        const d  = Math.sqrt(d2);
        const F  = K_IND * q / d2;
        const fx = F * dx / d, fy = F * dy / d;
        a.vx += fx; a.vy += fy;
        b.vx -= fx; b.vy -= fy;
        continue;
      }

      // ── Attraction cutoff ───────────────────────────
      // Opposite charges don't pull from across the room
      if (qa * qb < 0 && dRaw > attractCutoff()) continue;

      // ── Coulomb force (clamped at contact distance) ─
      const d2 = Math.max(dRaw * dRaw, minD * minD);
      const d  = Math.sqrt(d2);
      const F  = K_C * qa * qb / d2;
      const fx = F * dx / d, fy = F * dy / d;
      a.vx -= fx; a.vy -= fy;
      b.vx += fx; b.vy += fy;
    }
  }

  const MAX_V = 8;
  for (const inst of free) {
    inst.vx *= DAMP;
    inst.vy *= DAMP;
    inst.vx = Math.max(-MAX_V, Math.min(MAX_V, inst.vx));
    inst.vy = Math.max(-MAX_V, Math.min(MAX_V, inst.vy));
    inst.x  += inst.vx;
    inst.y  += inst.vy;
    const ir = rad(inst);
    if (inst.x < ir + PAD)                   { inst.x = ir + PAD;                   inst.vx =  Math.abs(inst.vx) * 0.45; }
    if (inst.x > canvas.width - ir - PAD)    { inst.x = canvas.width - ir - PAD;    inst.vx = -Math.abs(inst.vx) * 0.45; }
    if (inst.y < ir + PAD)                   { inst.y = ir + PAD;                   inst.vy =  Math.abs(inst.vy) * 0.45; }
    if (inst.y > canvas.height - ir - PAD)   { inst.y = canvas.height - ir - PAD;   inst.vy = -Math.abs(inst.vy) * 0.45; }
  }
}

// ═══════════════════════════════════════════════════════
// Drawing helpers
// ═══════════════════════════════════════════════════════
function capsule(x, y, rw, rh, angle) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  const rx = rw / 2, ry = rh / 2, rc = rw / 2;
  ctx.beginPath();
  ctx.moveTo(-rx + rc, -ry);
  ctx.lineTo( rx - rc, -ry);
  ctx.arc(rx - rc, 0, rc, -Math.PI/2, Math.PI/2);
  ctx.lineTo(-rx + rc,  ry);
  ctx.arc(-rx + rc, 0, rc, Math.PI/2, -Math.PI/2);
  ctx.closePath();
  ctx.restore();
}

function drawAura(x, y, r, q) {
  if (q === 0) return;
  const rgb = q > 0 ? '251,146,60' : '129,140,248';
  const t   = Math.min(Math.abs(q) / 8, 1);
  const g   = ctx.createRadialGradient(x, y, r * 0.4, x, y, r * 3.2);
  g.addColorStop(0, `rgba(${rgb},${(t * 0.55).toFixed(2)})`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.beginPath();
  ctx.arc(x, y, r * 3.2, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
}

function drawObject(inst) {
  const t  = TYPES[inst.type];
  const q  = ch(inst);
  const ir = rad(inst);
  const { x, y } = inst;

  drawAura(x, y, ir, q);

  const hasImg = !!(IMGS[inst.type]);
  ctx.save();
  ctx.shadowBlur  = inst.dragging ? 22 : 8;
  ctx.shadowColor = inst.dragging ? '#38bdf8' : 'rgba(0,0,0,0.5)';

  if (!hasImg) {
    // Draw solid shape background for emoji-based objects
    if (t.rod) {
      const rw = ir * 2 + 2, rh = ir * 4.5;
      capsule(x, y, rw, rh, inst.rodAngle);
      ctx.fillStyle   = t.color;
      ctx.fill();
      ctx.strokeStyle = inst.dragging ? '#38bdf8' : 'rgba(255,255,255,0.15)';
      ctx.lineWidth   = inst.dragging ? 2.5 : 1;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth   = 1;
      capsule(x - ir * 0.35, y, rw * 0.3, rh * 0.95, inst.rodAngle);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(x, y, ir, 0, Math.PI * 2);
      ctx.fillStyle   = t.color;
      ctx.fill();
      ctx.strokeStyle = inst.dragging ? '#38bdf8' : 'rgba(255,255,255,0.12)';
      ctx.lineWidth   = inst.dragging ? 2.5 : 1;
      ctx.stroke();
    }
  } else if (inst.dragging) {
    // Drag highlight ring only — no fill behind the image
    ctx.beginPath();
    ctx.arc(x, y, ir + 4, 0, Math.PI * 2);
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth   = 2.5;
    ctx.stroke();
  }
  ctx.restore();

  // Image (or emoji fallback for types without a model)
  const img = IMGS[inst.type];
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.save();
    ctx.translate(x, y);
    if (t.imgBlend) ctx.globalCompositeOperation = t.imgBlend;
    const sh = t.spriteH ?? SPRITE_H;
    const sw = sh * (img.naturalWidth / img.naturalHeight);
    if (t.rod) ctx.rotate(inst.rodAngle);
    ctx.drawImage(img, -sw / 2, -sh / 2, sw, sh);
    ctx.restore();
  } else {
    ctx.font         = `${ir * (t.rod ? 1.15 : 0.9)}px serif`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(t.emoji, x, y);
  }

  // Charge badge
  if (q !== 0) {
    const col  = q > 0 ? '#fb923c' : '#818cf8';
    const sign = q > 0 ? '+' : '−';
    ctx.font         = 'bold 13px Segoe UI, sans-serif';
    ctx.fillStyle    = col;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(`${sign}${Math.abs(q)}`, x, y - ir - 4);
  }

  const markerBase = clamp(Math.round(t.baseE / 2), 4, 8);
  if (t.rod) {
    const sh = (t.spriteH ?? SPRITE_H);
    drawChargeMarkers({
      x, y,
      protonCount: markerBase,
      electronCount: clamp(markerBase - q, 0, markerBase + 4),
      rod: true,
      rodAngle: inst.rodAngle,
      halfW: ir * 0.9,
      halfH: sh * 0.42,
    });
  } else {
    drawChargeMarkers({
      x, y, radius: ir,
      protonCount: markerBase,
      electronCount: clamp(markerBase - q, 0, markerBase + 4),
      rod: false,
    });
  }

  // Name
  ctx.font         = '10px Segoe UI, sans-serif';
  ctx.fillStyle    = 'rgba(148,163,184,0.75)';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(t.label, x, y + ir + 4);
}

// ═══════════════════════════════════════════════════════
// Draw ground rod
// ═══════════════════════════════════════════════════════
function drawGround() {
  const ty = groundTopY(), by = groundBotY();

  ctx.font         = '11px Segoe UI, sans-serif';
  ctx.fillStyle    = '#475569';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText('Ground', GX, ty - 4);

  // Ball/contact at top
  ctx.beginPath();
  ctx.arc(GX, ty, 9, 0, Math.PI * 2);
  ctx.fillStyle = '#64748b';
  ctx.fill();

  // Vertical rod
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth   = 5;
  ctx.lineCap     = 'round';
  ctx.beginPath();
  ctx.moveTo(GX, ty + 8);
  ctx.lineTo(GX, by - 14);
  ctx.stroke();

  // Ground lines
  ctx.lineWidth = 3;
  const lws = [28, 18, 10];
  for (let i = 0; i < 3; i++) {
    const lw = lws[i];
    const ly = by - 12 + i * 8;
    ctx.beginPath();
    ctx.moveTo(GX - lw/2, ly);
    ctx.lineTo(GX + lw/2, ly);
    ctx.stroke();
  }
}

// ═══════════════════════════════════════════════════════
// Draw electroscope
// ═══════════════════════════════════════════════════════
function drawElectroscope() {
  const sx     = scope.x;
  const ky     = scope.rodTopY;
  const pivotY = scope.pivotY;
  const ang    = scope.leafAngle;
  const leafL  = 62;

  // Determine visual properties
  const hasContact = scope.netCharge !== 0;
  const leafCol    = scope.leafSign > 0 ? '#fb923c' : scope.leafSign < 0 ? '#818cf8' : '#94a3b8';

  // Label
  ctx.font         = '11px Segoe UI, sans-serif';
  ctx.fillStyle    = '#475569';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText('Electroscope', sx, ky - 14);

  // Glass jar
  const jTop = pivotY - 24, jH = leafL + 42, jW = 96;
  ctx.fillStyle   = 'rgba(30,41,59,0.55)';
  ctx.strokeStyle = '#334155';
  ctx.lineWidth   = 1.5;
  ctx.beginPath();
  // Manual rounded-top rect
  const rad2 = 6;
  ctx.moveTo(sx - jW/2 + rad2, jTop);
  ctx.lineTo(sx + jW/2 - rad2, jTop);
  ctx.quadraticCurveTo(sx + jW/2, jTop, sx + jW/2, jTop + rad2);
  ctx.lineTo(sx + jW/2, jTop + jH);
  ctx.lineTo(sx - jW/2, jTop + jH);
  ctx.lineTo(sx - jW/2, jTop + rad2);
  ctx.quadraticCurveTo(sx - jW/2, jTop, sx - jW/2 + rad2, jTop);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Stem above jar
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth   = 5;
  ctx.lineCap     = 'round';
  ctx.beginPath();
  ctx.moveTo(sx, ky - 17);
  ctx.lineTo(sx, pivotY);
  ctx.stroke();

  // Knob
  ctx.beginPath();
  ctx.arc(sx, ky - 17, 15, 0, Math.PI * 2);
  ctx.fillStyle   = '#94a3b8';
  ctx.fill();
  if (hasContact) {
    ctx.strokeStyle = leafCol;
    ctx.lineWidth   = 2.5;
    ctx.stroke();
  }

  // Foil leaves
  ctx.strokeStyle = leafCol;
  ctx.lineWidth   = 2.8;
  ctx.lineCap     = 'round';
  ctx.beginPath();
  ctx.moveTo(sx, pivotY);
  ctx.lineTo(sx - leafL * Math.sin(ang), pivotY + leafL * Math.cos(ang));
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(sx, pivotY);
  ctx.lineTo(sx + leafL * Math.sin(ang), pivotY + leafL * Math.cos(ang));
  ctx.stroke();

  // Sign label on knob
  if (hasContact) {
    const sign = scope.netCharge > 0 ? '+' : '−';
    ctx.font         = 'bold 15px sans-serif';
    ctx.fillStyle    = leafCol;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(sign, sx, ky - 17);
  }

  // Spread angle label
  if (ang > 0.05) {
    const deg = Math.round(ang * 180 / Math.PI);
    ctx.font         = '10px Segoe UI, sans-serif';
    ctx.fillStyle    = 'rgba(148,163,184,0.6)';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(`${deg}°`, sx, jTop + jH + 3);
  }
  drawElectroscopeCharges(sx, ky, pivotY, leafL, ang);
}

// ═══════════════════════════════════════════════════════
// Background
// ═══════════════════════════════════════════════════════
function drawBg() {
  const style = getComputedStyle(document.documentElement);
  ctx.fillStyle = style.getPropertyValue('--canvas-bg').trim();
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = style.getPropertyValue('--canvas-grid').trim();
  ctx.lineWidth   = 1;
  for (let x = 0; x < canvas.width;  x += 60) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += 60) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }
}

// ═══════════════════════════════════════════════════════
// Main loop
// ═══════════════════════════════════════════════════════
function loop() {
  drawBg();

  updatePhysics();
  checkGround();
  if (apparatusMode === 'electroscope') updateScope();
  else updatePith();
  tickParticles();

  const dragged = instances.find(i => i.dragging);
  if (dragged) handleRubbing(dragged);
  else instances.forEach(i => { i.rubTimer = 0; });

  drawGround();
  if (apparatusMode === 'electroscope') drawElectroscope();
  else drawPithBall();
  for (const inst of instances) {
    drawObject(inst);
  }
  drawParticles();

  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════
// Input — mouse
// ═══════════════════════════════════════════════════════
let dragInst = null, dragOX = 0, dragOY = 0;

function startDrag(mx, my) {
  for (let i = instances.length - 1; i >= 0; i--) {
    const inst = instances[i];
    if (Math.hypot(mx - inst.x, my - inst.y) < rad(inst) + 8) {
      dragInst = inst;
      inst.dragging = true;
      inst.vx = inst.vy = 0;
      dragOX = mx - inst.x;
      dragOY = my - inst.y;
      instances.splice(i, 1);
      instances.push(inst);
      canvas.classList.add('dragging');
      break;
    }
  }
}

function moveDrag(mx, my) {
  if (!dragInst) return;
  dragInst.x = mx - dragOX;
  dragInst.y = my - dragOY;
}

function endDrag() {
  if (!dragInst) return;
  dragInst.dragging = false;
  dragInst.rubTimer = 0;
  dragInst.vx = (Math.random() - 0.5) * 0.4;
  dragInst.vy = (Math.random() - 0.5) * 0.4;
  dragInst = null;
  canvas.classList.remove('dragging');
}

canvas.addEventListener('mousedown',  e => startDrag(e.offsetX, e.offsetY));
canvas.addEventListener('mousemove',  e => moveDrag(e.offsetX, e.offsetY));
canvas.addEventListener('mouseup',    endDrag);
canvas.addEventListener('mouseleave', endDrag);

// Double-click to remove
canvas.addEventListener('dblclick', e => {
  const mx = e.offsetX, my = e.offsetY;
  for (let i = instances.length - 1; i >= 0; i--) {
    if (Math.hypot(mx - instances[i].x, my - instances[i].y) < rad(instances[i]) + 6) {
      instances.splice(i, 1);
      return;
    }
  }
});

// ── Touch ──
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const rc = canvas.getBoundingClientRect(), t = e.touches[0];
  startDrag(t.clientX - rc.left, t.clientY - rc.top);
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rc = canvas.getBoundingClientRect(), t = e.touches[0];
  moveDrag(t.clientX - rc.left, t.clientY - rc.top);
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  endDrag();
}, { passive: false });

// ═══════════════════════════════════════════════════════
// Palette
// ═══════════════════════════════════════════════════════
const toolbar = document.getElementById('toolbar');
for (const [key, t] of Object.entries(TYPES)) {
  const div = document.createElement('div');
  div.className = 'pitem';
  div.innerHTML = t.imgSrc
    ? `<img src="${t.imgSrc}" class="icon${t.imgBlend ? ' blend-multiply' : ''}" style="width:36px;height:36px;object-fit:contain;"><span>${t.label}</span>`
    : `<span class="icon">${t.emoji}</span><span>${t.label}</span>`;
  div.addEventListener('click', () => {
    const x = 160 + Math.random() * (canvas.width  - 320);
    const y = 100 + Math.random() * (canvas.height - 220);
    instances.push(mkInst(key, x, y));
  });
  toolbar.appendChild(div);
}

const resetBtn = document.createElement('div');
resetBtn.className = 'pitem';
resetBtn.style.cssText = 'margin-left:auto; border-color:#ef4444;';
resetBtn.innerHTML = '<span class="icon">↺</span><span>Reset</span>';
resetBtn.addEventListener('click', () => {
  instances.length   = 0;
  sparks.length      = 0;
  labels.length      = 0;
  scopeGlyphs.length = 0;
  scope.netCharge    = 0;
  scope.headCharge   = 0;
  scope.leafCharge   = 0;
  scope.leafAngle    = 0;
  scope.leafTarget   = 0;
  scope.leafSign     = 0;
  pith.angle         = 0;
  pith.angleV        = 0;
  pith.charge        = 0;
});
toolbar.appendChild(resetBtn);

// ═══════════════════════════════════════════════════════
// Theme toggle
// ═══════════════════════════════════════════════════════
const themeBtn = document.getElementById('theme-toggle');
const hintEl = document.querySelector('.hint');
const apparatusButtons = {
  electroscope: document.getElementById('show-electroscope'),
  pith: document.getElementById('show-pith'),
};
const applyTheme = (light) => {
  document.documentElement.classList.toggle('light', light);
  themeBtn.textContent = light ? '🌙 Dark' : '☀️ Light';
};
applyTheme(document.documentElement.classList.contains('light'));
themeBtn.addEventListener('click', () => {
  const light = !document.documentElement.classList.contains('light');
  localStorage.setItem('theme', light ? 'light' : 'dark');
  applyTheme(light);
});

function applyApparatusMode(mode) {
  apparatusMode = mode === 'pith' ? 'pith' : 'electroscope';
  apparatusButtons.electroscope.classList.toggle('active', apparatusMode === 'electroscope');
  apparatusButtons.pith.classList.toggle('active', apparatusMode === 'pith');
  apparatusButtons.electroscope.setAttribute('aria-selected', apparatusMode === 'electroscope' ? 'true' : 'false');
  apparatusButtons.pith.setAttribute('aria-selected', apparatusMode === 'pith' ? 'true' : 'false');
  hintEl.textContent = apparatusMode === 'electroscope'
    ? 'Click palette to add · Drag to rub · Double-click to remove'
    : 'Click palette to add · Drag near the pith ball · Double-click to remove';
}

apparatusButtons.electroscope.addEventListener('click', () => applyApparatusMode('electroscope'));
apparatusButtons.pith.addEventListener('click', () => applyApparatusMode('pith'));
applyApparatusMode(apparatusMode);

// ═══════════════════════════════════════════════════════
// Boot
// ═══════════════════════════════════════════════════════
loop();
</script>
</body>
</html>
